<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="theme-color" content="#000000"><title>Pulse — Strength</title><style>:root{--bg:#000;--fg:#f5f5f4;--mu:#8a8a8a;--mu2:#5c5c5c;--hl:#161616;--card:#0b0b0b;--ac:#F0894E;--acd:#7a3f1d;--ink:#0a0a0a;
 --spring:cubic-bezier(.32,1.2,.42,1);--ease:cubic-bezier(.2,.9,.25,1);--safe-t:env(safe-area-inset-top);--safe-b:env(safe-area-inset-bottom)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:#030303;color:var(--fg);font-family:"SF Pro Display","Inter",-apple-system,system-ui,sans-serif;-webkit-font-smoothing:antialiased;height:100%}
body{display:flex;justify-content:center;align-items:center;min-height:100vh}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input{font:inherit;color:inherit}
.app{width:390px;height:844px;background:var(--bg);border-radius:46px;position:relative;overflow:hidden;overflow:clip;box-shadow:0 0 0 9px #0d0d0d,0 0 0 10px #232323,0 40px 120px rgba(0,0,0,.9)}
@media (max-width:500px){html,body{background:#000}body{display:block}.app{width:100vw;height:100vh;height:100dvh;border-radius:0;box-shadow:none}}
.mono{font-family:ui-monospace,"SF Mono",Menlo,monospace;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--mu)}
.sample{font:500 10.5px ui-monospace,Menlo,monospace;letter-spacing:.08em;color:var(--mu2);text-transform:uppercase}
.ac{color:var(--ac)}
/* pages */
.page{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;padding:0 22px 150px;scrollbar-width:none;opacity:0;transform:translateX(30px) scale(.985);pointer-events:none;transition:opacity .35s var(--ease),transform .55s var(--spring)}
.page::-webkit-scrollbar{display:none}
.page.on{opacity:1;transform:none;pointer-events:auto}.page.left{transform:translateX(-30px) scale(.985)}
.nav{position:sticky;top:0;z-index:5;margin:0 -22px;padding:calc(var(--safe-t) + 14px) 22px 12px;display:flex;justify-content:center;align-items:center;min-height:56px;pointer-events:none}
.nav:before{content:"";position:absolute;inset:0;background:rgba(0,0,0,.78);backdrop-filter:blur(20px) saturate(1.4);-webkit-backdrop-filter:blur(20px) saturate(1.4);border-bottom:1px solid #1a1a1a;opacity:var(--nb,0);transition:opacity .2s}
.nav b{position:relative;font-size:17px;font-weight:600;opacity:var(--nb,0);transform:translateY(calc((1 - var(--nb,0))*6px));transition:opacity .2s,transform .2s}
.lt{font-size:40px;font-weight:600;letter-spacing:-.04em;line-height:1.05;margin:8px 0 6px;transform-origin:left bottom;transform:scale(var(--ls,1));opacity:var(--lo,1)}
.sub{color:var(--mu);font-size:15px}
section.blk{margin-top:52px}
.bh{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:16px}
.bh h2{font-size:24px;font-weight:600;letter-spacing:-.03em}
.bh a,.link{color:var(--ac);font-size:15px;cursor:pointer}
.card{background:var(--card);border:1px solid #171717;border-radius:22px;padding:22px}
.row{display:flex;align-items:center;gap:14px}
.sp{flex:1}
.pill{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 12px;border-radius:14px;font-size:13px;font-weight:500;border:1px solid #262626;color:#d4d4d4}
.pill.up{color:var(--ac);border-color:color-mix(in srgb,var(--ac) 40%,#000)}.pill.flat{color:#a3a3a3}.pill.down{color:#d4d4d4;border-style:dashed}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;min-height:52px;padding:0 20px;border-radius:16px;font-size:16px;font-weight:600;border:1px solid #2a2a2a;transition:transform .15s var(--ease),background .2s}
.btn:active{transform:scale(.97)}.btn.p{background:var(--ac);border-color:var(--ac);color:var(--ink)}.btn.w{background:#f5f5f4;color:#000;border-color:#f5f5f4}
.chips{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;margin:0 -22px;padding:2px 22px}.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:44px;padding:0 18px;border-radius:22px;border:1px solid #262626;display:flex;align-items:center;font-size:15px;color:#bdbdbd;cursor:pointer;transition:all .2s var(--ease)}
.chip.on{background:#f5f5f4;color:#000;border-color:#f5f5f4}
.seg{display:flex;background:#0f0f0f;border-radius:14px;padding:4px;gap:4px}
.seg button{flex:1;height:40px;border-radius:10px;font-size:14px;font-weight:500;color:#8a8a8a;transition:all .25s var(--ease)}
.seg button.on{background:#262626;color:#fff}
.lrow{display:flex;align-items:center;gap:14px;padding:16px 0;border-bottom:1px solid #121212;cursor:pointer}
.lrow:last-child{border-bottom:0}
.lrow b{font-weight:500;font-size:16px;display:block}.lrow span.s{font-size:14px;color:var(--mu)}
.big{font-size:30px;font-weight:600;letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.stat{background:var(--card);border:1px solid #171717;border-radius:18px;padding:18px}
.stat b{display:block;font-size:26px;font-weight:600;letter-spacing:-.03em;margin-top:6px;font-variant-numeric:tabular-nums}
.more{width:100%;height:48px;border-radius:14px;border:1px solid #1d1d1d;color:#d4d4d4;font-size:15px;margin-top:12px}
/* tab bar */
.tabs{position:absolute;left:14px;right:14px;bottom:calc(var(--safe-b) + 14px);height:72px;border-radius:30px;background:rgba(14,14,14,.82);backdrop-filter:blur(24px) saturate(1.5);-webkit-backdrop-filter:blur(24px) saturate(1.5);border:1px solid #222;display:flex;align-items:center;justify-content:space-around;z-index:20;padding:0 6px}
.tabs button{width:58px;height:58px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:#6b6b6b;font-size:10.5px;font-weight:500;border-radius:18px;transition:color .25s,transform .3s var(--spring)}
.tabs button.on{color:#fff}.tabs button:active{transform:scale(.9)}
.tabs .train{width:64px;height:64px;border-radius:50%;background:var(--ac);color:#000;margin-top:-26px;box-shadow:0 10px 30px rgba(240,137,78,.35),0 0 0 6px #000;gap:0}
.tabs .train.live{animation:breathe 2.4s ease-in-out infinite}
@keyframes breathe{50%{box-shadow:0 10px 40px rgba(240,137,78,.6),0 0 0 6px #000}}
/* reveal */
.rv{opacity:0;transform:translateY(22px);transition:opacity .7s var(--ease),transform .9s var(--spring);transition-delay:var(--d,0s)}
.rv.in{opacity:1;transform:none}
.split .w{display:inline-block;overflow:hidden;vertical-align:bottom;padding-bottom:.08em;margin-bottom:-.08em}
.split .w>span{display:inline-block;transform:translateY(105%);transition:transform .9s var(--spring);transition-delay:calc(var(--i)*55ms + var(--d,0s))}
.split.in .w>span{transform:none}
.draw{stroke-dasharray:1;stroke-dashoffset:1}
.in .draw,.draw.in{animation:draw 1.6s var(--ease) forwards;animation-delay:var(--d,0s)}
@keyframes draw{to{stroke-dashoffset:0}}
.grow{transform:scaleY(0);transform-origin:bottom;transform-box:fill-box;transition:transform .9s var(--spring);transition-delay:calc(var(--i,0)*35ms)}
.in .grow{transform:none}
.sweep{transition:stroke-dashoffset 1.4s var(--ease)}
.fadein{opacity:0;transition:opacity 1s .5s}.in .fadein{opacity:1}
/* hero */
.hero{position:relative;height:430px;margin:0 -22px;display:flex;flex-direction:column;justify-content:flex-end;padding:0 22px 6px;will-change:transform,opacity}
.stage{position:absolute;left:50%;top:calc(var(--safe-t) + 40px);width:300px;height:250px;margin-left:-150px;perspective:900px}
.plates{position:absolute;inset:0;transform-style:preserve-3d;animation:tilt 14s ease-in-out infinite}
@keyframes tilt{0%,100%{transform:rotateX(62deg) rotateZ(0deg)}50%{transform:rotateX(56deg) rotateZ(14deg)}}
.plate{position:absolute;left:50%;top:50%;width:230px;height:230px;margin:-115px;transform-style:preserve-3d}
.plate svg{width:100%;height:100%;animation:spin 40s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.orbit{position:absolute;inset:-10px;animation:spin 60s linear infinite reverse}
.orb-l{position:absolute;left:50%;top:50%;font:600 11px ui-monospace,Menlo,monospace;letter-spacing:.06em;color:#d4d4d4;white-space:nowrap}
.orb-l i{color:var(--ac);font-style:normal}
.hglow{position:absolute;left:50%;top:150px;width:360px;height:260px;margin-left:-180px;background:radial-gradient(closest-side,rgba(240,137,78,.28),transparent);pointer-events:none}
.hk{font-size:13px;color:var(--mu);letter-spacing:.02em}
.hnum{font-size:64px;font-weight:600;letter-spacing:-.055em;line-height:.95;font-variant-numeric:tabular-nums}
.hnum small{font-size:22px;letter-spacing:-.02em;color:var(--mu);font-weight:500;margin-left:6px}
.pred{margin-top:12px;font-size:15px;color:#d4d4d4}
.today{margin-top:26px}
.today h3{font-size:26px;font-weight:600;letter-spacing:-.03em;margin:6px 0 4px}
.startbtn{height:68px;border-radius:22px;font-size:19px;margin-top:18px;width:100%;position:relative;overflow:hidden}
.startbtn:after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.35) 50%,transparent 70%);transform:translateX(-100%);animation:shine 3.5s 1.5s ease-in-out infinite}
@keyframes shine{40%,100%{transform:translateX(100%)}}
/* heatmap */
.heat{display:grid;grid-auto-columns:1fr;grid-template-rows:repeat(7,1fr);grid-auto-flow:column;gap:3px}
.heat i{width:100%;aspect-ratio:1;border-radius:3px;background:#141414;transform:scale(0);transition:transform .5s var(--spring);transition-delay:calc(var(--i)*6ms)}
.in .heat i{transform:none}
/* muscle */
.mm{display:flex;gap:6px;justify-content:center}
.fig{position:relative;width:150px;height:330px}
.fig img{width:100%;height:100%;object-fit:contain;opacity:.9}
.fig .tint{position:absolute;inset:0;-webkit-mask-size:contain;mask-size:contain;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;-webkit-mask-position:center;mask-position:center;mix-blend-mode:color}
.fig .tint i{position:absolute;border-radius:50%;background:radial-gradient(closest-side,var(--ac),transparent);opacity:0;transition:opacity 1.2s var(--ease);transition-delay:calc(var(--i)*80ms)}
.in .fig .tint i{opacity:var(--o)}
.fig .glo{position:absolute;inset:0;-webkit-mask-size:contain;mask-size:contain;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;-webkit-mask-position:center;mask-position:center;mix-blend-mode:screen;opacity:.55}
.fig .glo i{position:absolute;border-radius:50%;background:radial-gradient(closest-side,rgba(240,137,78,.7),transparent);opacity:0;transition:opacity 1.2s}.in .fig .glo i{opacity:var(--o)}
.mleg{display:flex;flex-direction:column;gap:12px;margin-top:20px}
.mbar{display:grid;grid-template-columns:96px 1fr 42px;align-items:center;gap:12px;font-size:14px}
.mbar .tr{height:6px;border-radius:3px;background:#161616;overflow:hidden}.mbar .tr i{display:block;height:100%;background:var(--ac);border-radius:3px;transform:scaleX(0);transform-origin:left;transition:transform 1s var(--spring);transition-delay:calc(var(--i)*60ms)}
.in .mbar .tr i{transform:scaleX(var(--p))}
.mbar span:last-child{text-align:right;color:var(--mu);font-variant-numeric:tabular-nums}
/* coach card */
.orb{width:44px;height:44px;border-radius:50%;flex:none;background:conic-gradient(from 0deg,var(--ac),#3b1a08,#ffd2b5,var(--ac));animation:spin 6s linear infinite;position:relative}
.orb:after{content:"";position:absolute;inset:3px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#2a2a2a,#000 70%)}
.typing{display:inline-flex;gap:4px}.typing i{width:6px;height:6px;border-radius:50%;background:#737373;animation:tp 1s infinite}.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes tp{30%{opacity:1;transform:translateY(-3px)}0%,60%,100%{opacity:.3}}
.bubble{max-width:84%;padding:14px 16px;font-size:16px;line-height:1.45;margin-top:12px;border-radius:20px}
.bubble.ai{background:#101010;border:1px solid #1c1c1c;border-bottom-left-radius:6px}.bubble.me{background:#f5f5f4;color:#000;margin-left:auto;border-bottom-right-radius:6px}
.composer{position:relative;display:flex;gap:8px;padding:8px;margin-top:20px;border-radius:26px;background:rgba(16,16,16,.92);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid #232323}
.composer input{flex:1;background:none;border:0;outline:none;padding:0 12px;font-size:16px}
.send{width:44px;height:44px;border-radius:50%;background:var(--ac);color:#000;display:grid;place-items:center}
/* charts */
.chart{position:relative;user-select:none;-webkit-user-select:none;touch-action:pan-y}
.chart svg{display:block;width:100%;overflow:visible}
.tip{position:absolute;top:0;transform:translateX(-50%);background:#f5f5f4;color:#000;padding:6px 10px;border-radius:10px;font-size:13px;font-weight:600;white-space:nowrap;pointer-events:none;opacity:0;transition:opacity .15s}
.tip.on{opacity:1}
table.rm{width:100%;border-collapse:collapse;font-size:15px;font-variant-numeric:tabular-nums}
table.rm td{padding:12px 0;border-bottom:1px solid #121212}table.rm td:not(:first-child){text-align:right}
table.rm th{font:500 11px ui-monospace,Menlo,monospace;letter-spacing:.08em;color:var(--mu2);text-align:right;padding-bottom:8px}table.rm th:first-child{text-align:left}
/* overlays */
.sheet{position:absolute;inset:0;z-index:40;background:#000;transform:translateY(102%);transition:transform .6s var(--spring);display:flex;flex-direction:column}
.sheet:not(.on){visibility:hidden;transition:transform .6s var(--spring),visibility 0s .6s}.sheet.on{transform:none}
.sh-h{padding:calc(var(--safe-t) + 14px) 22px 10px;display:flex;align-items:center;gap:12px}
.sh-b{flex:1;overflow-y:auto;overflow-x:hidden;padding:0 22px 40px;scrollbar-width:none}.sh-b::-webkit-scrollbar{display:none}
.ib{width:44px;height:44px;border-radius:14px;border:1px solid #232323;display:grid;place-items:center;color:#d4d4d4;flex:none}
.ib:active{transform:scale(.92)}
/* live */
#live .timer{font-size:15px;color:var(--mu);font-variant-numeric:tabular-nums}
.ltop{display:flex;align-items:flex-end;justify-content:space-between;margin:6px 0 20px}
.ltop .t{font-size:44px;font-weight:600;letter-spacing:-.05em;font-variant-numeric:tabular-nums;line-height:1}
.vol{text-align:right}.vol b{font-size:22px;font-weight:600;letter-spacing:-.03em;color:var(--ac);font-variant-numeric:tabular-nums;display:block}
.exnav{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -22px;padding:0 22px 4px}.exnav::-webkit-scrollbar{display:none}
.exnav button{flex:none;height:40px;padding:0 14px;border-radius:20px;border:1px solid #232323;font-size:14px;color:#a3a3a3;display:flex;align-items:center;gap:8px}
.exnav button.on{border-color:#f5f5f4;color:#fff}.exnav button .d{width:7px;height:7px;border-radius:50%;background:#333}.exnav button .d.ok{background:var(--ac)}
.exh{margin-top:24px}
.exh h2{font-size:34px;font-weight:600;letter-spacing:-.045em;line-height:1.05}
.ai{margin-top:16px;padding:16px 18px;border-radius:18px;background:linear-gradient(135deg,rgba(240,137,78,.14),rgba(240,137,78,.03));border:1px solid rgba(240,137,78,.28);display:flex;gap:12px;align-items:center}
.ai .spark{width:28px;height:28px;flex:none;color:var(--ac)}
.ai b{font-weight:600}.ai p{font-size:15px;line-height:1.4;color:#e7e5e4}
.ai button{margin-left:auto;flex:none;height:36px;padding:0 14px;border-radius:12px;background:var(--ac);color:#000;font-weight:600;font-size:14px}
.sets{margin-top:20px}
.sh{display:grid;grid-template-columns:24px 1fr 1fr 44px 52px;gap:8px;padding:0 0 8px;font:500 11px ui-monospace,Menlo,monospace;letter-spacing:.08em;color:var(--mu2);text-transform:uppercase}
.set{display:grid;grid-template-columns:24px 1fr 1fr 44px 52px;gap:8px;align-items:center;padding:20px 0 8px;border-radius:16px;transition:background .4s}
.set .n{font-size:15px;color:var(--mu);text-align:center}
.step{display:flex;align-items:center;height:52px;border-radius:14px;background:#0f0f0f;border:1px solid #1d1d1d}
.step button{width:32px;height:100%;color:#8a8a8a;font-size:20px}
.step input{width:100%;min-width:0;background:none;border:0;text-align:center;font-size:19px;font-weight:600;font-variant-numeric:tabular-nums;outline:none}
.step .gh{position:absolute}
.cell{position:relative}.cell .ghost{position:absolute;left:0;right:0;top:-17px;text-align:center;font-size:10.5px;color:#4a4a4a;font-family:ui-monospace,Menlo,monospace}
.rpe{height:52px;border-radius:14px;border:1px solid #1d1d1d;font-size:14px;color:#a3a3a3}
.chk{width:52px;height:52px;border-radius:16px;border:1.5px solid #333;display:grid;place-items:center;transition:background .3s,border-color .3s,transform .3s var(--spring)}
.chk svg path{stroke-dasharray:24;stroke-dashoffset:24;transition:stroke-dashoffset .4s var(--ease) .05s}
.set.done .chk{background:var(--ac);border-color:var(--ac);transform:scale(1.04)}.set.done .chk svg path{stroke-dashoffset:0}
.set.done .step input{color:#d4d4d4}
.set.pr{background:rgba(240,137,78,.08)}
.set.pop .chk{animation:pop .5s var(--spring)}
@keyframes pop{40%{transform:scale(1.25)}}
.prtag{font:600 10px ui-monospace,Menlo,monospace;color:var(--ac);letter-spacing:.08em}
.addset{height:48px;border-radius:14px;border:1px dashed #2a2a2a;color:#a3a3a3;width:100%;margin-top:10px;font-size:15px}
.lfoot{padding:12px 22px calc(var(--safe-b) + 16px);display:flex;gap:10px;border-top:1px solid #121212;background:#000}
/* rest */
.rest{position:absolute;left:0;right:0;bottom:0;z-index:5;background:rgba(5,5,5,.94);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:1px solid #222;border-radius:30px 30px 0 0;padding:22px 22px calc(var(--safe-b) + 22px);transform:translateY(105%);transition:transform .55s var(--spring);display:flex;flex-direction:column;align-items:center}
.rest.on{transform:none}
.ring{position:relative;width:220px;height:220px}
.ring svg{transform:rotate(-90deg)}
.ring .c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .c b{font-size:56px;font-weight:600;letter-spacing:-.05em;font-variant-numeric:tabular-nums}
/* PR */
.prb{pointer-events:none;position:absolute;left:22px;right:22px;top:calc(var(--safe-t) + 70px);z-index:8;padding:18px 20px;border-radius:22px;background:var(--ac);color:#000;transform:translateY(-140%) scale(.9);opacity:0;transition:transform .6s var(--spring),opacity .3s;box-shadow:0 20px 60px rgba(240,137,78,.45)}
.prb.on{transform:none;opacity:1}
.prb b{font-size:22px;font-weight:700;letter-spacing:-.03em;display:block}
.conf{position:absolute;inset:0;pointer-events:none;z-index:9;overflow:hidden}
.conf i{position:absolute;top:-10px;width:8px;height:14px;border-radius:2px;animation:fall var(--t) cubic-bezier(.2,.6,.4,1) forwards}
@keyframes fall{to{transform:translate3d(var(--x),900px,0) rotate(var(--r));opacity:.2}}
.flash{position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at 50% 40%,rgba(240,137,78,.35),transparent 60%);opacity:0;z-index:7}
.flash.on{animation:fl 1.2s ease-out}
@keyframes fl{15%{opacity:1}100%{opacity:0}}
/* island */
.island{position:absolute;left:50%;top:11px;height:36px;min-width:126px;transform:translateX(-50%);background:#000;border-radius:20px;z-index:60;display:flex;align-items:center;gap:10px;padding:0 6px 0 6px;transition:min-width .5s var(--spring),height .5s var(--spring),border-radius .5s var(--spring);cursor:pointer}
@media (max-width:500px){.island{display:none}.island.on{display:flex;top:calc(var(--safe-t) + 4px)}}
.island .ii{display:none;align-items:center;gap:10px;width:100%;padding:0 6px;color:#fff;font-size:14px;font-weight:600;font-variant-numeric:tabular-nums}
.island.on{min-width:240px;height:44px;border-radius:24px;box-shadow:0 0 0 1px #1d1d1d}
.island.on .ii{display:flex}
.island .ir{width:28px;height:28px}
/* summary */
.share{border-radius:26px;padding:26px;background:radial-gradient(120% 90% at 100% 0%,rgba(240,137,78,.45),transparent 60%),#0d0d0d;border:1px solid #2a2a2a;position:relative;overflow:hidden}
.share .big{font-size:52px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}

const UPC='#F0894E',DNC='#8a8a8a';
const RGD2={'1W':7,'1M':30,'3M':91,'1Y':365,'ALL':1e5};
const RMET=[['e1','e1RM'],['a1','Actual 1RM'],['vol','Volume'],['reps','Reps'],['top','Top set']];
function rhSeries(n,k,days){if(days>45){return mSeries(n,k,days)}const agg=MET.find(m=>m[0]===k)[2];return sessions(n).filter(s=>s.ts>Date.now()-days*DAY&&(agg==='sum'||s.sets.some(x=>x.rpe>6.5))).map(s=>({x:s.ts,y:mval(k,s)})).filter(p=>p.y!=null)}
const pct=(a,b)=>b?((a-b)/b*100):0;
function dlt(k,a,b){const d=a-b,p=pct(a,b),s=d>=0?'+':'−';return`${s}${k==='reps'?fmt(Math.abs(d)):fmt(Math.abs(toU(d)))}${k==='reps'?'':' '+U()} (${s}${Math.abs(p).toFixed(1)}%)`}
function spark(v,w=72,h=28){if(v.length<2)return`<svg width="${w}" height="${h}"></svg>`;const mn=Math.min(...v),mx=Math.max(...v),c=v[v.length-1]>=v[0]?UPC:DNC;return`<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}"><path d="${v.map((y,i)=>(i?'L':'M')+(i*w/(v.length-1)).toFixed(1)+' '+(h-3-(y-mn)/(mx-mn||1)*(h-6)).toFixed(1)).join(' ')}" fill="none" stroke="${c}" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/></svg>`}
// ---- HOME
let rM=null,pillMode=0;
function recents(){const last={};all().forEach(w=>w.ex.forEach(e=>{if(e.sets.some(s=>s.done))last[e.n]=w.ts}));return Object.entries(last).sort((a,b)=>b[1]-a[1]).map(x=>x[0])}
function recRows(){const k=rM;return recents().slice(0,8).map(n=>{const S=sessions(n).filter(s=>(MET.find(m=>m[0]===k)[2]==='sum')||s.sets.some(x=>x.rpe>6.5)).map(s=>mval(k,s)).filter(v=>v!=null).slice(-12);const lt=lastOf(n);
 if(!S.length)return`<button class="wrow" onclick="rhOpen('${n}')"><div class="wl"><b>${n}</b><span>${dstr(lt.ts,{month:'short',day:'numeric'})}</span></div><span class="sp"></span><span class="wpill none">—</span></button>`;
 const v=S[S.length-1],up=v>=S[0];return`<button class="wrow" onclick="rhOpen('${n}')"><div class="wl"><b>${n}</b><span>${ago2(lt.ts)}</span></div><span class="sp"></span>${spark(S)}<span class="wpill ${up?'up':'dn'} num" onclick="event.stopPropagation();pillMode=1-pillMode;haptic();document.getElementById('wlist').innerHTML=recRows()">${pillMode?(up?'+':'−')+Math.abs(pct(v,S[0])).toFixed(1)+'%':k==='reps'?fmt(v):fmt(toU(v))+(k==='vol'?'':'')}</span></button>`}).join('')}
function ago2(t){const d=Math.floor((Date.now()-t)/DAY);return d<1?'Today':d===1?'Yesterday':d<7?dstr(t,{weekday:'long'}):dstr(t,{month:'short',day:'numeric'})}
function rhOpen(n){pM=rM;st.pM=rM;openProgress(n)}
function rHome(){rM=rM||st.rM||'e1';

const ABOUT={'Bench Press':'The flat barbell bench press is the classic upper-body strength lift: you lower a barbell to your chest and press it back to lockout. It builds the chest, front shoulders and triceps and is the standard test of pressing strength.',
'Back Squat':'A barbell squat with the bar across your upper back. You sit down between your heels and stand back up, training the whole lower body and trunk. It is the foundation of most strength programs.',
'Deadlift':'You lift a loaded barbell from the floor to standing by driving through the legs and extending the hips. It trains the entire posterior chain and grip and usually lets you move the most weight of any lift.',
'Overhead Press':'Standing with the bar in the front rack, you press it straight overhead to lockout. It builds shoulder strength and stability and demands a braced, tight trunk.',
'Barbell Row':'A hinged-over pull: with your torso around 45°, you row the bar to your lower ribs. It builds the lats and mid-back and balances all the pressing in your program.',
'Weighted Pull-up':'A strict pull-up with extra load on a belt. You pull from a dead hang until your chest meets the bar, building lats, upper back and biceps.',
'Incline DB Press':'A dumbbell press on a 30° bench that shifts emphasis to the upper chest and front shoulders, with a longer range of motion than the barbell.',
'Romanian Deadlift':'A hip hinge from the top down: you push the hips back with soft knees until the hamstrings are stretched, then stand tall. It is the go-to hamstring and glute builder.',
'Leg Press':'A machine press that loads the quads and glutes heavily without the balance demands of a squat, making it a great volume builder.',
'Lat Pulldown':'A cable pull from overhead to your upper chest. It trains the same pattern as a pull-up with adjustable load.',
'Barbell Curl':'The standard biceps builder: curl the bar from full extension to the shoulders with your elbows pinned.',
'Triceps Pushdown':'A cable extension that isolates the triceps through a full lockout.',
'Lateral Raise':'A dumbbell raise out to the sides that targets the side deltoids for wider shoulders.',
'Hip Thrust':'With your upper back on a bench, you drive a loaded bar up with your hips. It is the most direct glute strength exercise.',
'Calf Raise':'Rising onto the balls of the feet under load, through a full stretch and squeeze, to build the calves.'};
const SEC2={'Incline DB Press':['Shoulders','Triceps'],'Leg Press':['Glutes','Hamstrings'],'Lat Pulldown':['Biceps'],'Hip Thrust':['Hamstrings','Quads'],'Lateral Raise':['Back'],'Barbell Curl':[],'Triceps Pushdown':[],'Calf Raise':[]};
let mediaRAF=null;
function rProgress(){pState();if(!RGD2[pR])pR='3M';const n=pEx,S=sessions(n),best=S.reduce((a,s)=>s.e1>a.e1?s:a,S[0]||{e1:0});const WK=weekly(n);let ost=0;for(let i=WK.length-1;i>0;i--){if(WK[i].e1>=WK[i-1].e1*.99)ost++;else break}
 const rm=Array.from({length:10},(_,i)=>{const r=i+1,act=S.flatMap(s=>s.sets.filter(x=>x.r===r)).reduce((a,x)=>Math.max(a,x.w),0);return[r,best.e1/(1+(r===1?0:r)/30),act]});
 const P=prs().ev.filter(e=>e.n===n);const F=Object.assign(GEN(n),FORM[n]||{});const sec=FORM[n]?FORM[n].sec:(SEC2[n]||[]);const mus={[EX[n].m]:1};sec.forEach(m=>mus[m]=.45);
 $('#p-progress').innerHTML=`<div class="psearch"><button data-test="psearch" onclick="openPicker()"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8a8a8a" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg><span>Search exercises</span><span class="sp"></span><span class="pscur">${n}</span></button></div>
 <div class="rhh"><button class="rhname" onclick="openPicker()" id="exsel"><span id="exname">${n}</span><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#8a8a8a" stroke-width="2.6" stroke-linecap="round"><path d="M6 9l6 6 6-6"/></svg></button>
 <div class="rhv num" id="rhv"></div><div class="rhd num" id="rhd"></div></div>
 <div class="rhc" id="rhc"></div>
 <div class="tabs2 rng" id="rng">${Object.keys(RGD2).map(r=>`<button class="${r===pR?'on':''}" data-r="${r}" onclick="pR='${r}';st.pR=pR;save();haptic();rhDraw(true)">${r}</button>`).join('')}</div>
 <div class="mseg" id="mseg" style="margin-top:18px">${MET.map(([k,l])=>`<button class="${k===pM?'on':''}" data-m="${k}" onclick="pM='${k}';st.pM=pM;save();haptic();rhDraw(true)">${l}</button>`).join('')}</div>
 ${S.length?`<section class="blk" style="margin-top:36px"><div class="grid2">${[['Best e1RM',WU(best.e1||0)],['Best set',best.best?toU(best.best.w)+' × '+best.best.r:'—'],['Overload streak',ost+(ost===1?' week':' weeks')],['Sessions',S.length+' total']].map(([k,v])=>`<div class="stat"><span class="mono">${k}</span><b>${v}</b></div>`).join('')}</div></section>`:`<div class="empty" style="margin-top:30px"><b>No sets logged yet</b><span>Add ${n} to a workout and this page fills in from the first set.</span></div>`}

 rhDraw(false);mediaGo(n)}
function mediaGo(n){cancelAnimationFrame(mediaRAF);const A=ANIM[n],root=document.getElementById('media');if(!A||!root)return;const pa=POSE[A[0]],pb=POSE[A[1]];

 root.querySelector('#fpbar').setAttribute('opacity',pa.pbar?1:0);const t0=performance.now();

function rhDraw(anim){document.querySelectorAll('#rng button').forEach(b=>b.classList.toggle('on',b.dataset.r===pR));document.querySelectorAll('#mseg button').forEach(b=>b.classList.toggle('on',b.dataset.m===pM));
 const pts=rhSeries(pEx,pM,RGD2[pR]),el=$('#rhc'),hv=$('#rhv'),hd=$('#rhd');const lab=MET.find(m=>m[0]===pM)[1];
 const val=v=>pM==='reps'?fmt(v)+'<small> reps</small>':fmt(toU(v))+`<small> ${U()}</small>`;
 if(pts.length<1){el.innerHTML=`<div class="empty" style="margin:10px 0"><b>No ${lab.toLowerCase()} in this range</b><span>${pM==='a1'?'Test a true single to see it here.':'Try a longer range.'}</span></div>`;hv.innerHTML='—';hd.textContent='';return}
 const first=pts[0].y,last=pts[pts.length-1].y,up=last>=first,col=up?UPC:DNC;const rangeTxt={'1W':'past week','1M':'past month','3M':'past 3 months','1Y':'past year','ALL':'all time'}[pR];
 const setHead=(v,txt,c)=>{hv.innerHTML=val(v);hd.innerHTML=`<span style="color:${c}">${dlt(pM,v,first)}</span> <span class="k">${txt}</span>`};

 const W=390,H=200,ys=pts.map(p=>p.y);let mn=Math.min(...ys),mx=Math.max(...ys);const pad=(mx-mn||mx*.05||1)*.15;mn-=pad;mx+=pad;const x0=pts[0].x,x1=Math.max(pts[pts.length-1].x,x0+1);
 const X=x=>pts.length===1?W/2:(x-x0)/(x1-x0)*(W-8)+4,Y=y=>H-8-(y-mn)/(mx-mn)*(H-16);const d=pts.map((p,i)=>(i?'L':'M')+X(p.x).toFixed(1)+' '+Y(p.y).toFixed(1)).join(' ');
 el.innerHTML=`<svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}" preserveAspectRatio="none"><line x1="0" x2="${W}" y1="${Y(first)}" y2="${Y(first)}" stroke="#2e2e2e" stroke-dasharray="1 5" stroke-linecap="round" stroke-width="2"/>
  ${pM==='a1'?pts.map(p=>`<circle cx="${X(p.x)}" cy="${Y(p.y)}" r="4" fill="${col}"/>`).join('')+`<path d="${d}" fill="none" stroke="${col}" stroke-opacity=".35" stroke-width="1.5" stroke-dasharray="2 4" vector-effect="non-scaling-stroke"/>`:`<path class="rhl" d="${d}" pathLength="1" fill="none" stroke="${col}" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/>`}
  <line class="cur" x1="0" x2="0" y1="0" y2="${H}" stroke="#444" stroke-width="1" opacity="0" vector-effect="non-scaling-stroke"/></svg><span class="rdot" style="background:${col}"></span><span class="rdate"></span>`;
 const ln=el.querySelector('.rhl');if(ln&&anim&&!RM){ln.style.strokeDasharray=1;ln.style.strokeDashoffset=1;ln.getBoundingClientRect();ln.style.transition='stroke-dashoffset .9s cubic-bezier(.3,.8,.3,1)';ln.style.strokeDashoffset=0}
 const cur=el.querySelector('.cur'),dot=el.querySelector('.rdot'),dt=el.querySelector('.rdate');let lastI=-1;

  cur.setAttribute('x1',X(p.x));cur.setAttribute('x2',X(p.x));cur.setAttribute('opacity',1);dot.style.left=X(p.x)/W*100+'%';dot.style.background=p.y>=first?UPC:DNC;dot.style.top=Y(p.y)+'px';dot.style.opacity=1;dt.textContent=dstr(p.x,{month:'short',day:'numeric',year:'numeric'});dt.style.left=Math.min(88,Math.max(12,X(p.x)/W*100))+'%';dt.style.opacity=1;
