:root{--c-strength:#F0894E;--c-cardio:#EE6470;--c-mood:#A88CF4;--c-sleep:#8296F6;--c-nutrition:#A9D06C;--c-hydration:#52C7DD;--accent:#fafafa;--ink:#0a0a0a;
 --s1:4px;--s2:8px;--s3:12px;--s4:16px;--s5:24px;--s6:32px;--spring:cubic-bezier(.32,1.18,.42,1);--ease:cubic-bezier(.2,.9,.25,1)}
[data-t=strength],[data-d=strength]{--accent:var(--c-strength)}[data-t=cardio],[data-d=cardio]{--accent:var(--c-cardio)}[data-t=mood],[data-d=mood]{--accent:var(--c-mood)}
[data-t=sleep],[data-d=sleep]{--accent:var(--c-sleep)}[data-t=nutrition],[data-d=nutrition]{--accent:var(--c-nutrition)}[data-t=hydration],[data-d=hydration]{--accent:var(--c-hydration)}
/* wheel colouring */
.readout .k,.readout .v{transition:color .3s var(--ease)!important}
.seg .prog{transition:stroke .3s var(--ease),opacity .3s}
.ico .icb,.ico g{transition:stroke .3s var(--ease),fill .3s}
.plus{transition:transform .6s var(--spring),box-shadow .3s,background .3s!important}.plus.drag{transition:box-shadow .3s,background .3s!important}
/* accent scope: tool + dash */
:is(.tool,.dash) .btn.fill{background:var(--accent);border-color:var(--accent);color:var(--ink)}
:is(.tool,.dash) .btn:not(.fill):not(.ghost){border-color:color-mix(in srgb,var(--accent) 70%,#000)}
:is(.tool,.dash) .chipx.on{background:var(--accent);border-color:var(--accent);color:var(--ink)}
:is(.tool,.dash) .mbar i{background:var(--accent)}
:is(.tool,.dash) .toggle.on{background:var(--accent)}
:is(.tool,.dash) .card.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 6%,#050505)}
:is(.tool,.dash) .huge{color:var(--accent)}
:is(.tool,.dash) .inp:focus{border-color:var(--accent)}
:is(.tool,.dash) input[type=range]{accent-color:var(--accent)}
:is(.tool,.dash) .ck.on,.dash .chk.on i,.tool .moods div.on,.dash .play.on{background:var(--accent);border-color:var(--accent);color:var(--ink)}
.tool .moods div.on{color:var(--ink)}
.tool .rest{border-color:var(--accent)}.tool .rest b{color:var(--accent)}
.tool .setr .mono{color:var(--accent)!important}
#ttl,.dhead h2{color:var(--accent);transition:color .3s}
.thead .grab{background:color-mix(in srgb,var(--accent) 55%,#222)}
.dsec>h4{border-bottom-color:color-mix(in srgb,var(--accent) 80%,#000)}
.dash .bdot{background:var(--accent);box-shadow:0 0 18px var(--accent)}.dash .bfill{background:color-mix(in srgb,var(--accent) 22%,transparent)}.dash .bbox{border-color:color-mix(in srgb,var(--accent) 45%,#222)}
.dash .eq i{background:var(--accent)}
.dash .figure{background:radial-gradient(closest-side,color-mix(in srgb,var(--accent) 22%,#000),#000 75%)}
.dash .figure img{filter:drop-shadow(0 0 18px color-mix(in srgb,var(--accent) 35%,transparent))}
.dash .det[open] summary b{color:var(--accent)}.dash .det[open] summary:after{color:var(--accent)}
.dash .statg b,.tool .statg b{color:#fafafa}
.dback{color:var(--accent)}
/* polish */
.tool{transition:transform .6s var(--spring)}.dash{transition:transform .55s var(--spring)}
.page{transition:opacity .3s var(--ease),transform .5s var(--spring)}
.btn{min-height:44px;transition:transform .15s var(--ease),background .2s,opacity .2s}.btn.sm{min-height:36px}
.btn:active,.chipx:active,.x:active,.ck:active,.play:active,.toggle:active,.tabbar a:active,.moods div:active,.chk:active,.dback:active{transform:scale(.95)}
.chipx,.x,.ck,.play,.toggle,.btn.sm,.dback,.tabbar a{position:relative;transition:transform .15s var(--ease),background .2s,color .2s,border-color .2s}
.chipx::before,.x::before,.ck::before,.play::before,.toggle::before,.btn.sm::before{content:"";position:absolute;inset:-6px -2px}
.chipx{min-height:34px;display:inline-flex;align-items:center}
.x{width:34px;height:34px}
.lrow,.det summary{min-height:48px}
.det summary:active{opacity:.7}
.hair,.lrow,.det,.chk,.mealr{border-color:#1a1a1a}
.blabel{padding:0 18px;display:flex;flex-direction:column;align-items:center;justify-content:center}.blabel small{max-width:120px;margin:6px auto 0;line-height:1.5}.dash .bfill{opacity:.9}
.empty{border:1px dashed #2a2a2a;border-radius:2px;padding:22px 16px;text-align:center;color:#737373;font-size:13px;margin-top:10px}
.empty b{display:block;color:#d4d4d4;font-weight:500;font-size:15px;margin:8px 0 2px}
.dhead .mono{margin-bottom:2px}
.thead h3,.dhead h2{padding-bottom:2px}

#glow{position:absolute;inset:0;z-index:0;pointer-events:none;overflow:hidden}
#glow .beam{position:absolute;width:820px;height:520px;margin-top:-260px;transform-origin:0 50%;opacity:0;filter:blur(34px);
 transform-origin:120px 50%;-webkit-mask-image:linear-gradient(90deg,transparent 0,#000 200px),radial-gradient(ellipse 85% 50% at 120px 50%,#000 0%,rgba(0,0,0,.55) 35%,transparent 72%);-webkit-mask-composite:source-in;mask-image:linear-gradient(90deg,transparent 0,#000 200px),radial-gradient(ellipse 85% 50% at 120px 50%,#000 0%,rgba(0,0,0,.55) 35%,transparent 72%);mask-composite:intersect;
 transition:opacity .45s var(--ease),transform .45s var(--spring),background-color .45s var(--ease),left .3s,top .3s}
#glow .core{position:absolute;width:260px;height:260px;margin:-130px 0 0 -130px;border-radius:50%;opacity:0;filter:blur(40px);transition:opacity .45s,background-color .45s,left .45s var(--spring),top .45s var(--spring)}
#glow.on .beam{opacity:.34}#glow.on .core{opacity:.3}
.page{z-index:1}.page#p-home{background:transparent}
/* coach */
.orb{width:56px;height:56px;border-radius:50%;flex:none;background:conic-gradient(from 0deg,var(--c-strength),var(--c-cardio),var(--c-mood),var(--c-sleep),var(--c-nutrition),var(--c-hydration),var(--c-strength));position:relative;animation:spin 8s linear infinite;filter:saturate(.8)}
.orb:after{content:"";position:absolute;inset:3px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#3a3a3a,#000 70%)}
@keyframes spin{to{transform:rotate(360deg)}}
.live{display:inline-flex;align-items:center;gap:6px}.live:before{content:"";width:6px;height:6px;border-radius:50%;background:var(--c-nutrition);box-shadow:0 0 8px var(--c-nutrition)}
.bubble{max-width:84%;padding:10px 12px;font-size:14px;line-height:1.45;margin-top:8px;border-radius:14px}
.bubble.ai{background:#111;border:1px solid #1f1f1f;border-bottom-left-radius:3px}
.bubble.me{background:#fafafa;color:#000;margin-left:auto;border-bottom-right-radius:3px}
.bubble .who{display:block;font:500 9px ui-monospace,Menlo,monospace;letter-spacing:.12em;text-transform:uppercase;color:#737373;margin-bottom:3px}
.typing{display:inline-flex;gap:4px;padding:4px 0}.typing i{width:6px;height:6px;border-radius:50%;background:#737373;animation:tp 1s infinite}.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes tp{0%,60%,100%{opacity:.3;transform:none}30%{opacity:1;transform:translateY(-3px)}}
#cbarw{position:absolute;left:14px;right:14px;bottom:calc(env(safe-area-inset-bottom) + 92px);z-index:21;opacity:0;pointer-events:none;transform:translateY(10px);transition:opacity .3s,transform .4s var(--spring)}#cbarw.on{opacity:1;pointer-events:auto;transform:none}
.cbar{display:flex;gap:6px;margin-top:14px;padding:8px;background:rgba(12,12,12,.94);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid #262626;border-radius:24px;z-index:3}
.cbar .inp{border:0;background:transparent;padding:8px 10px}
.send{width:40px;height:40px;border-radius:50%;background:#fafafa;color:#000;display:grid;place-items:center;border:0;flex:none;cursor:pointer}.send:active{transform:scale(.92)}
.secref{font-weight:600}#p-coach{padding-bottom:190px}
.icard{border:1px solid #262626;border-left:3px solid var(--ac,#fff);padding:12px 14px;margin-top:10px;cursor:pointer;display:flex;gap:12px;align-items:center}
.icard:active{background:#0d0d0d}.icard b{font-weight:500;display:block}.icard span{font-size:12px;color:#8a8a8a}
/* detail */
.seg2{display:flex;border:1px solid #262626;border-radius:4px;padding:2px;gap:2px}
.seg2 span{flex:1;text-align:center;font:600 11px ui-monospace,Menlo,monospace;letter-spacing:.08em;padding:9px 0;border-radius:3px;color:#8a8a8a;cursor:pointer;position:relative}
.seg2 span:before{content:"";position:absolute;inset:-4px 0}
.seg2 span.on{background:var(--accent);color:var(--ink)}
.chart{user-select:none;-webkit-user-select:none;position:relative;margin-top:14px;touch-action:pan-y}
.chart svg{display:block;width:100%;overflow:visible}
.tip{position:absolute;top:-6px;transform:translateX(-50%);background:#fafafa;color:#000;padding:5px 8px;border-radius:3px;font:600 11px ui-monospace,Menlo,monospace;white-space:nowrap;pointer-events:none;opacity:0;transition:opacity .15s;z-index:2}
.tip.on{opacity:1}
.stat3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px}
.stat3>div{border:1px solid #1f1f1f;padding:10px}.stat3 b{display:block;font-size:20px;font-weight:500;letter-spacing:-.03em;margin-top:4px;font-variant-numeric:tabular-nums}
.btbl{width:100%;border-collapse:collapse;font-size:13px}.btbl th{font:500 9.5px ui-monospace,Menlo,monospace;letter-spacing:.1em;text-transform:uppercase;color:#737373;text-align:left;padding:8px 0;border-bottom:1px solid #262626}
.btbl td{padding:10px 0;border-bottom:1px solid #1a1a1a;font-variant-numeric:tabular-nums}.btbl td:not(:first-child),.btbl th:not(:first-child){text-align:right}
.dash .hero-v{font-size:44px;font-weight:500;letter-spacing:-.05em;color:var(--accent);line-height:1}
/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin-top:10px}
.cal .h{font:500 10px ui-monospace,Menlo,monospace;color:#525252;text-align:center;padding:6px 0}
.cal .d{aspect-ratio:1/1.1;border:1px solid #1a1a1a;padding:5px 4px;cursor:pointer;display:flex;flex-direction:column;justify-content:space-between;min-height:44px}
.cal .d.o{opacity:.25}.cal .d.t{border-color:#525252}.cal .d.sel{border-color:#fafafa;background:#0f0f0f}
.cal .d b{font-size:12px;font-weight:500}.cal .d .dots2{display:flex;flex-wrap:wrap;gap:2px}.cal .d .dots2 i{width:5px;height:5px;border-radius:50%}
.cnav{display:flex;align-items:center;justify-content:space-between;margin-top:18px}
.cnav h3{font-size:24px;font-weight:500;letter-spacing:-.04em}

/* ===== ambient light ===== */
.amb{position:absolute;inset:0;z-index:0;pointer-events:none;overflow:hidden;border-radius:inherit;contain:strict}
.amb-in{position:absolute;inset:-10% -10% -10% -10%;will-change:transform}
.amb i{position:absolute;display:block;border-radius:50%;will-change:transform,opacity;opacity:0;
 --a:var(--accent);--lt:color-mix(in srgb,var(--accent) 60%,#fff);--dk:color-mix(in srgb,var(--accent) 65%,#000);
 background:radial-gradient(closest-side,color-mix(in srgb,var(--a) 100%,transparent),color-mix(in srgb,var(--a) 40%,transparent) 45%,transparent)}
.dhead,.thead{background:linear-gradient(#000 0%,rgba(0,0,0,.72) 100%)!important;position:relative;z-index:1}
.thead{background:linear-gradient(rgba(5,5,5,.9),rgba(5,5,5,.6))!important}
.dbody,.tbody{position:relative;z-index:1}
.dash .card,.tool .excard{background:rgba(5,5,5,.78)}
.amb .bl{left:var(--bx,50%);top:var(--by,0%);width:520px;height:520px;margin:-260px 0 0 -260px;--a:var(--lt)}
.bloom .amb .bl{animation:bloom 1.6s cubic-bezier(.2,.8,.2,1) both}
@keyframes bloom{0%{opacity:0;transform:scale(.2)}25%{opacity:.5}100%{opacity:0;transform:scale(2.4)}}
.bloom .amb .amb-in{animation:settle 1.8s ease-out both}
@keyframes settle{0%{opacity:0}40%{opacity:1}100%{opacity:1}}
/* --- strength: forge beam --- */
[data-d=strength] .amb .l1,[data-t=strength] .amb .l1{left:-10%;top:-25%;width:120%;height:75%;border-radius:50%;animation:forge 9s ease-in-out infinite}
[data-d=strength] .amb .l2,[data-t=strength] .amb .l2{right:-15%;top:30%;width:70%;height:45%;--a:var(--dk);animation:drift1 14s ease-in-out infinite}
[data-d=strength] .amb .l3,[data-t=strength] .amb .l3{left:-20%;bottom:5%;width:65%;height:40%;--a:color-mix(in srgb,var(--accent) 70%,#ff3b1f);animation:drift2 18s ease-in-out -6s infinite}
@keyframes forge{0%,100%{opacity:.22;transform:scale(1)}8%{opacity:.34;transform:scale(1.05)}14%{opacity:.24}20%{opacity:.32;transform:scale(1.04)}40%{opacity:.2;transform:scale(.98)}70%{opacity:.27;transform:scale(1.02)}}
/* --- cardio: pace sweep + heartbeat --- */
[data-d=cardio] .amb .l1,[data-t=cardio] .amb .l1{left:-30%;top:-10%;width:70%;height:120%;border-radius:40%;animation:sweep 8s cubic-bezier(.45,0,.55,1) infinite}
[data-d=cardio] .amb .l2,[data-t=cardio] .amb .l2{left:10%;top:-20%;width:80%;height:55%;animation:beat 8s ease-out infinite}
[data-d=cardio] .amb .l3,[data-t=cardio] .amb .l3{right:-20%;bottom:-5%;width:70%;height:45%;--a:var(--dk);animation:drift1 12s ease-in-out -3s infinite}
@keyframes sweep{0%{opacity:0;transform:translate3d(-20%,0,0) rotate(-12deg)}20%{opacity:.26}50%{opacity:.3;transform:translate3d(130%,0,0) rotate(8deg)}70%{opacity:.18}100%{opacity:0;transform:translate3d(-20%,0,0) rotate(-12deg)}}
@keyframes beat{0%,12.5%,25%,37.5%,50%,62.5%,75%,87.5%,100%{opacity:.16;transform:scale(1)}3%,15.5%,28%,40.5%,53%,65.5%,78%,90.5%{opacity:.32;transform:scale(1.06)}6%,18.5%,31%,43.5%,56%,68.5%,81%,93.5%{opacity:.2}8%,20.5%,33%,45.5%,58%,70.5%,83%,95.5%{opacity:.27;transform:scale(1.03)}}
/* --- mood: aurora ribbons --- */
[data-d=mood] .amb i:not(.bl),[data-t=mood] .amb i:not(.bl){border-radius:50%;height:22%;width:150%;left:-25%}
[data-d=mood] .amb .l1,[data-t=mood] .amb .l1{top:2%;animation:aur 18s ease-in-out infinite}
[data-d=mood] .amb .l2,[data-t=mood] .amb .l2{top:18%;--a:color-mix(in srgb,var(--accent) 60%,#ff7ac8);animation:aur 20s ease-in-out -7s infinite reverse}
[data-d=mood] .amb .l3,[data-t=mood] .amb .l3{top:40%;--a:color-mix(in srgb,var(--accent) 55%,#5fd4ff);animation:aur 16s ease-in-out -11s infinite}
@keyframes aur{0%,100%{opacity:.14;transform:translate3d(-8%,0,0) rotate(-8deg) scaleY(.8)}50%{opacity:.3;transform:translate3d(8%,20px,0) rotate(6deg) scaleY(1.3)}}
/* --- sleep: moon + twinkles --- */
[data-d=sleep] .amb .l1,[data-t=sleep] .amb .l1{right:-25%;top:-20%;width:95%;height:60%;--a:var(--lt);animation:moon 20s ease-in-out infinite}
[data-d=sleep] .amb .l2,[data-t=sleep] .amb .l2{left:-30%;top:45%;width:80%;height:50%;--a:var(--dk);animation:drift2 20s ease-in-out -8s infinite}
[data-d=sleep] .amb .l4,[data-t=sleep] .amb .l4{left:0;top:0;width:2px;height:2px;background:#fff;border-radius:50%;
 box-shadow:60px 140px 0 0 #fff,300px 90px 0 .5px #dfe4ff,220px 260px 0 0 #fff,90px 420px 0 .5px #dfe4ff,340px 520px 0 0 #fff,160px 640px 0 0 #fff,40px 760px 0 .5px #fff;animation:twinkle 9s ease-in-out infinite}
[data-d=sleep] .amb .l3,[data-t=sleep] .amb .l3{left:0;top:0;width:2px;height:2px;background:#fff;box-shadow:120px 60px 0 0 #fff,260px 200px 0 0 #fff,30px 300px 0 0 #dfe4ff,360px 380px 0 0 #fff,250px 700px 0 .5px #fff;animation:twinkle 13s ease-in-out -5s infinite}
@keyframes moon{0%,100%{opacity:.3;transform:translate3d(0,0,0) scale(1)}50%{opacity:.16;transform:translate3d(-30px,20px,0) scale(1.08)}}
@keyframes twinkle{0%,100%{opacity:.15}30%{opacity:.55}60%{opacity:.08}80%{opacity:.4}}
/* --- nutrition: sun dapple --- */
[data-d=nutrition] .amb i:not(.bl),[data-t=nutrition] .amb i:not(.bl){width:48%;height:30%}
[data-d=nutrition] .amb .l1,[data-t=nutrition] .amb .l1{left:-8%;top:-6%;width:90%!important;height:45%!important;--a:color-mix(in srgb,var(--accent) 70%,#ffe27a);animation:dap 11s ease-in-out infinite}
[data-d=nutrition] .amb .l2,[data-t=nutrition] .amb .l2{right:-5%;top:22%;animation:dap 9s ease-in-out -3s infinite}
[data-d=nutrition] .amb .l3,[data-t=nutrition] .amb .l3{left:12%;top:52%;--a:var(--dk);animation:dap 13s ease-in-out -7s infinite}
[data-d=nutrition] .amb .l4,[data-t=nutrition] .amb .l4{right:8%;top:72%;--a:var(--lt);animation:dap 10s ease-in-out -5s infinite}
@keyframes dap{0%,100%{opacity:.14;transform:translate3d(0,0,0) scale(.9)}33%{opacity:.3;transform:translate3d(14px,-10px,0) scale(1.08)}66%{opacity:.18;transform:translate3d(-12px,8px,0) scale(.96)}}
/* --- hydration: caustics --- */
[data-d=hydration] .amb .l1,[data-t=hydration] .amb .l1{left:-20%;top:-15%;width:140%;height:70%;animation:drift1 14s ease-in-out infinite}
[data-d=hydration] .amb .l2,[data-t=hydration] .amb .l2,[data-d=hydration] .amb .l3,[data-t=hydration] .amb .l3{width:160%;height:110%;left:-30%;top:-5%;border-radius:0;
 background:repeating-radial-gradient(ellipse at 30% 40%,transparent 0 18px,color-mix(in srgb,var(--lt) 70%,transparent) 20px,transparent 26px 44px);
 -webkit-mask-image:radial-gradient(ellipse at 50% 20%,#000,transparent 70%);mask-image:radial-gradient(ellipse at 50% 20%,#000,transparent 70%)}
[data-d=hydration] .amb .l2,[data-t=hydration] .amb .l2{animation:caus 12s ease-in-out infinite}
[data-d=hydration] .amb .l3,[data-t=hydration] .amb .l3{background:repeating-radial-gradient(ellipse at 70% 60%,transparent 0 22px,color-mix(in srgb,var(--accent) 70%,transparent) 24px,transparent 30px 52px);animation:caus 16s ease-in-out -6s infinite reverse}
@keyframes caus{0%,100%{opacity:.1;transform:translate3d(0,0,0) rotate(0deg) scale(1)}50%{opacity:.2;transform:translate3d(-24px,18px,0) rotate(6deg) scale(1.06)}}
/* shared drifts */
@keyframes drift1{0%,100%{opacity:.16;transform:translate3d(0,0,0) scale(1)}50%{opacity:.26;transform:translate3d(-30px,24px,0) scale(1.1)}}
@keyframes drift2{0%,100%{opacity:.14;transform:translate3d(0,0,0) rotate(0)}50%{opacity:.24;transform:translate3d(28px,-18px,0) rotate(10deg)}}
/* gentler on tools + detail pages */
.tool .amb,#bdet .amb{opacity:.6}
.tool:not([data-t]) .amb,#bdet:not([data-d]) .amb{display:none}
/* pause when hidden */
.dash:not(.show) .amb *,.tool:not(.show) .amb *,.paused .amb *{animation-play-state:paused!important}
/* strength hero */
.dash .figure{background:none!important;position:relative}
.dash .figure:before{content:"";position:absolute;left:50%;top:50%;width:300px;height:340px;margin:-170px 0 0 -150px;border-radius:50%;background:radial-gradient(closest-side,color-mix(in srgb,var(--accent) 45%,transparent),transparent);animation:hero 6s ease-in-out infinite;will-change:transform,opacity;pointer-events:none}
.dash .figure img{position:relative}
.dash:not(.show) .figure:before{animation-play-state:paused}
@keyframes hero{0%,100%{opacity:.55;transform:scale(.95)}50%{opacity:.9;transform:scale(1.06)}}

function tHydration(){const T=today(),g=st.goals.water,p=Math.min(1,T.ml/g),L=st.water.filter(w=>isToday(w.ts)).sort((a,b)=>b.ts-a.ts);
 return`<div class="vessel"><svg width="120" height="190" viewBox="0 0 120 190"><defs><clipPath id="vc"><path d="M14 8h92l-10 172H24z"/></clipPath></defs><g clip-path="url(#vc)"><rect class="wfill" x="0" y="${186-178*p}" width="120" height="${178*p+4}" fill="url(#lines)"/><rect class="wfill" x="0" y="${186-178*p}" width="120" height="2" fill="#fff"/></g><path d="M14 8h92l-10 172H24z" fill="none" stroke="#fff" stroke-width="1.5"/>${[.25,.5,.75].map(f=>`<line x1="98" x2="106" y1="${186-178*f}" y2="${186-178*f}" stroke="#fff" opacity=".5"/>`).join('')}</svg>
 <div><div class="mono">Today</div><div class="huge" data-test="ml">${fmtN(T.ml)}</div><div class="mono">ml of ${fmtN(g)} · ${Math.round(p*100)}%</div><div style="margin-top:10px;font-size:13px;color:#a3a3a3">${(T.ml/250).toFixed(1)} / ${g/250} cups</div></div></div>
 <div class="row3" style="margin-top:18px"><button class="btn fill" data-test="cup" onclick="A.w(250)">+ Cup<br>250</button><button class="btn" onclick="A.w(500)">+ Bottle<br>500</button><button class="btn ghost" onclick="A.wUndo()" ${L.length?'':'disabled'}>Undo<br>last</button></div>
 <div style="display:flex;gap:6px;margin-top:8px"><input class="inp" id="w-c" type="number" placeholder="Custom ml"><button class="btn sm" onclick="A.w(+$('#w-c').value)">Add</button></div>
 <div class="lbl mono">Log</div>${L.map(w=>`<div class="lrow"><span class="mono" style="color:#fff;min-width:64px">${tstr(w.ts)}</span><div class="g"><b>${w.ml} ml</b></div><span class="x" onclick="A.wDel(${st.water.indexOf(w)})">×</span></div>`).join('')||'<div class="empty"><b>Glass is empty</b>Tap + Cup to log your first 250 ml.</div>'}`}

const D={};
// --- strength
function libList(){const q=dv.q.toLowerCase();const L=LIB.filter(e=>(dv.mus==='All'||e[1]===dv.mus)&&(!q||e[0].toLowerCase().includes(q)||e[2].toLowerCase().includes(q)));
 const groups=[...new Set(L.map(e=>e[1]))];
 return groups.map(g=>`<div class="mono" style="margin-top:14px;color:#fff">${g}</div>`+L.filter(e=>e[1]===g).map(e=>det(e[0],`${e[1]} · ${e[2]}`,`<div class="mono">Steps</div><ol>${e[3].map(x=>`<li>${x}</li>`).join('')}</ol><div class="mono" style="margin-top:8px">Coaching cues</div><ul>${e[4].map(x=>`<li>${x}</li>`).join('')}</ul>`)).join('')).join('')||'<p style="color:#737373;font-size:13px;padding:12px 0">No exercises match.</p>'}
function dStrength(){const d=DX(),p=PROGS[d.prog],wk=d.prog==='pb'?3:1;const g=d.sgoals;
 const cur={bench:185,squat:275,dead:335,pull:10};
 return`<div class="figure"><img id="mm-img" src="${d.mmView==='front'?MMF:MMB}" alt="Muscle map ${d.mmView}"></div>
 <div style="display:flex;justify-content:space-between;align-items:center;margin-top:6px"><div class="chips">${['front','back'].map(v=>`<span class="chipx${d.mmView===v?' on':''}" data-test="mm-${v}" onclick="D.mm('${v}')">${v==='front'?'Front':'Back'}</span>`).join('')}</div><span class="mono" id="mus-sel">${dv.mus==='All'?'All muscles':dv.mus}</span></div>
 <div class="chips" style="margin-top:10px" id="mus-chips">${['All',...MUS.filter(m=>m[1]===d.mmView).map(m=>m[0])].map(m=>`<span class="chipx${dv.mus===m?' on':''}" data-mus="${m}" onclick="D.mus('${m}')">${m}</span>`).join('')}</div>
 ${sec('Current program',SAMPLE,`<div class="card on"><div class="row"><div><div class="mono">${p[1]} · ${p[2]} weeks</div><h5 style="font-size:24px">${p[0]}</h5></div><div style="text-align:right"><div class="mono">Week</div><div style="font-size:24px;font-weight:500">${wk}<span style="color:#737373">/${p[2]}</span></div></div></div>${pbar(wk/p[2])}
  <div class="mono" style="margin-top:14px">Today · Day 2 — Lower (heavy)</div>${TODAY_SESS.map((x,i)=>`<div class="lrow"><span class="mono" style="color:var(--accent);width:22px">${i+1}</span><div class="g"><b>${x[0]}</b><span>${x[1]} · ${x[2]}</span></div></div>`).join('')}
  <button class="btn fill" style="width:100%;margin-top:12px" onclick="openTool('strength')">Start today's session</button></div>`)}
 ${sec('Program catalog','Swipe →',`<div class="hs">${Object.entries(PROGS).map(([k,v])=>`<div class="card${k===d.prog?' on':''}"><div class="mono">${v[1]} · ${v[2]} wk</div><h5>${v[0]}</h5><p style="font-size:12px;color:#a3a3a3;margin:6px 0 12px;min-height:34px">${v[3]}</p><button class="btn sm ${k===d.prog?'fill':''}" onclick="D.prog('${k}')">${k===d.prog?'Active':'Switch'}</button></div>`).join('')}</div>`)}
 ${sec('Strength goals','Tap target to edit',[['bench','Bench press','lb'],['squat','Back squat','lb'],['dead','Deadlift','lb'],['pull','Strict pull-ups','reps']].map(([k,n,u])=>`<div class="lrow" style="display:block"><div style="display:flex;justify-content:space-between;align-items:center"><b style="font-weight:500">${n}</b><span style="font-size:13px;color:#a3a3a3">${cur[k]} → <input class="inp" type="number" value="${g[k]}" onchange="D.sgoal('${k}',this.value)" style="width:70px;padding:4px 6px;text-align:right;display:inline-block"> ${u}</span></div>${pbar(cur[k]/g[k])}<div class="mono" style="margin-top:4px">${Math.round(cur[k]/g[k]*100)}% · current is sample</div></div>`).join(''))}
 ${sec('Exercise library',LIB.length+' moves',`<input class="inp" placeholder="Search exercises or equipment" value="${esc(dv.q)}" oninput="dv.q=this.value;$('#lib').innerHTML=libList()" style="margin-top:10px"><div id="lib" data-test="lib">${libList()}</div>`)}
 ${sec('Form guides','',[['Bracing 101','Breathe 360° into your belly, then brace like taking a punch. Re-brace every rep on heavy sets.'],['Progressive overload','Add load, reps, or sets week to week. Small jumps (2.5–5 lb) beat stalls.'],['RPE & RIR','RPE 8 ≈ 2 reps in reserve. Most working sets live at RPE 7–9.'],['When to deload','Every 4–8 weeks, or when bar speed and motivation drop: cut volume ~40% for a week.'],['Warm-up ramp','Empty bar ×10, 40% ×5, 60% ×3, 80% ×1, then work sets.']].map(([t,b])=>det(t,'Guide · 2 min read',b)).join(''))}`}
D.mm=v=>{DX().mmView=v;save();if(!MUS.some(m=>m[0]===dv.mus&&m[1]===v))dv.mus='All';renderDash()};
D.mus=m=>{dv.mus=m;document.querySelectorAll('#mus-chips .chipx').forEach(c=>c.classList.toggle('on',c.dataset.mus===m));$('#mus-sel').textContent=m==='All'?'All muscles':m;$('#lib').innerHTML=libList()};

const PLANS={c25k:['Couch-to-5K','9 weeks · 3×/wk','Walk/run intervals building to a continuous 30-min run.',['Wk 4 · Day 1: 5 min WU, run 3 / walk 1.5 / run 5 / walk 2.5 ×2','Wk 4 · Day 2: same, focus on easy breathing','Wk 4 · Day 3: same, finish with 5 min cooldown'],4,9],z2:['Zone 2 Base','12 weeks · 4×/wk','Aerobic base: long, conversational efforts at 60–70% max HR.',['Mon 40 min Z2 run','Wed 45 min Z2 ride','Sat 75 min Z2 long'],1,12],hiit:['HIIT Engine','6 weeks · 2×/wk','Short, hard intervals to raise VO₂max.',['Tue 6×1 min hard / 2 min easy','Fri 10×30 s all-out / 90 s easy'],1,6]};
function dCardio(){const d=DX(),pl=PLANS[d.cplan],mx=220-d.age,cg=d.cgoals;

let brT=null;
function stopBreath(){clearInterval(brT);brT=null;dv.brOn=false}
D.breath=()=>{if(dv.brOn){stopBreath();renderDash();return}dv.brOn=true;renderDash();let t=0;const P=['Inhale','Hold','Exhale','Hold'];
 const step=()=>{const ph=Math.floor(t/4)%4,s=t%4;const dot=$('#bdot'),lab=$('#blab'),fill=$('#bfill');if(!dot){stopBreath();return}
  const pos=[[0,0],[170,0],[170,170],[0,170]],a=pos[(ph+3)%4],b=pos[ph];// move along side ph during that phase
  const q=[[0,170],[0,0],[170,0],[170,170]][ph],r=[[0,0],[170,0],[170,170],[0,170]][ph];
  dot.style.transition='left 1s linear, top 1s linear';const k=(s+1)/4;dot.style.left=(q[0]+(r[0]-q[0])*k-7)+'px';dot.style.top=(q[1]+(r[1]-q[1])*k-7)+'px';
  fill.style.transition='transform 1s linear';fill.style.transform=`scaleY(${ph===0?.2+.8*k:ph===1?1:ph===2?1-.8*k:.2})`;

// simpler bento: 6 big tiles with sparkline
function spark(kind,m){const S=series(kind,m,'7D'),v=S.map(x=>x.v),mx=Math.max(...v,1),mn=Math.min(...v,0);const pts=v.map((y,i)=>`${(i*100/6).toFixed(1)},${(30-(y-mn)/(mx-mn||1)*26).toFixed(1)}`).join(' ');
 return`<svg class="bt-s" viewBox="0 0 100 32" preserveAspectRatio="none"><polyline points="${pts}" fill="none" stroke="#fafafa" stroke-opacity=".75" stroke-width="1.6" vector-effect="non-scaling-stroke" stroke-linejoin="round" stroke-linecap="round"/></svg>`}
function renderBento(){const T=TD,g=st.goals,D=days7(),tot=D.map(d=>dayMin(d.k)).reduce((a,b)=>a+b,0);
 const tiles=[['activity','minutes','Active · 7 days',hm(tot),''],['sleep','duration','Sleep',T.sl?hm(T.sl.min):'—','last night'],['heart','resting','Resting heart','58','bpm'],
  ['macros','split','Calories',fmtN(T.kcal),'/ '+fmtN(g.kcal)],['hydration','intake','Water',String(Math.floor(T.ml/250)),'/ '+g.water/250+' cups'],['mood','mood','Mood',T.md?MOODS[T.md.mood-1]:'—','today']];
 $('#bento').innerHTML=tiles.map(([k,m,l,v,u])=>`<div class="t" data-detail="${k}" data-test="tile-${k}"><div><div class="tl">${l}</div><div class="bt-v">${v}<small>${u}</small></div></div>${spark(k,m)}</div>`).join('')}
