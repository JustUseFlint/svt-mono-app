<script>const $=s=>document.querySelector(s),DAY=864e5,KEY='pulse.mono.v1';
const dk=t=>{const d=new Date(t);return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate()};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmtN=n=>Math.round(n).toLocaleString('en-US');
const hm=m=>`${Math.floor(m/60)}h ${String(Math.round(m%60)).padStart(2,'0')}m`;
const clk=s=>{s=Math.max(0,Math.floor(s));const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return(h?h+':'+String(m).padStart(2,'0'):m)+':'+String(x).padStart(2,'0')};
const tstr=t=>new Date(t).toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'});
const dstr=t=>new Date(t).toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'});
const isToday=t=>dk(t)===dk(Date.now());
const MOODS=['Awful','Low','Okay','Good','Great'];
const FOODS=[['Oatmeal, 1 cup',158,6,27,3],['Banana',105,1,27,0],['Greek yogurt, 170g',100,17,6,1],['Eggs, 2 large',143,13,1,10],['Avocado toast',290,8,30,16],['Chicken breast, 150g',248,46,0,5],['Brown rice, 1 cup',216,5,45,2],['Salmon, 150g',312,33,0,19],['Broccoli, 1 cup',55,4,11,1],['Almonds, 28g',164,6,6,14],['Protein shake',160,30,4,2],['Apple',95,0,25,0],['Turkey sandwich',380,28,40,11],['Pasta bolognese',520,26,62,17],['Caesar salad',330,12,14,26],['Black coffee',2,0,0,0],['Peanut butter, 2 tbsp',188,8,6,16],['Sweet potato',112,2,26,0],['Steak, 200g',500,50,0,32],['Dark chocolate, 30g',170,2,13,12]];
const EXS=['Bench Press','Squat','Deadlift','Overhead Press','Barbell Row','Pull-up','Lunge','Bicep Curl'];
let st;
function seed(){const n=Date.now();let r=7;const rnd=()=>(r=(r*9301+49297)%233280)/233280;
 st={goals:{kcal:2200,water:2000,sleep:8,cardio:40,sets:16,p:150,c:250,f:70},unit:'lb',strength:[],cardio:[],mood:[],sleep:[],food:[],water:[],live:{s:null,c:null}};
 for(let d=6;d>=1;d--){const t=n-d*DAY;
  if(d%2==0)st.strength.push({ts:t-3*36e5,dur:2400+rnd()*1200|0,vol:7000+rnd()*4000|0,sets:12+(rnd()*6|0),ex:['Bench Press','Squat','Barbell Row']});
  else st.cardio.push({ts:t-5*36e5,type:['run','bike','row'][d%3],dur:1500+rnd()*1500|0,dist:4000+rnd()*4000|0,hr:130+rnd()*20|0});
  st.mood.push({ts:t-2*36e5,mood:3+(rnd()*2.4|0),energy:50+rnd()*40|0,stress:20+rnd()*40|0,tags:['Work'],note:''});
  const m=400+rnd()*90|0;st.sleep.push({date:dk(t),bed:'23:'+String(rnd()*50|0).padStart(2,'0'),wake:'06:'+String(rnd()*50|0).padStart(2,'0'),q:3+(rnd()*2|0),min:m});
  st.water.push({ts:t,ml:1500+rnd()*700|0});st.food.push({ts:t,meal:'Lunch',n:'Daily total',kcal:1900+rnd()*500|0,p:120+rnd()*40|0,c:200,f:60});}
 const h=t=>{const d=new Date();d.setHours(t,Math.random()*50|0,0,0);return Math.min(+d,n)};
 st.sleep.push({date:dk(n),bed:'23:04',wake:'06:16',q:4,min:432});
 st.mood.push({ts:h(9),mood:4,energy:70,stress:30,tags:['Rested','Focused'],note:'Good morning run.'});
 st.cardio.push({ts:h(7),type:'run',dur:1080,dist:3200,hr:138});
 [['Breakfast',0],['Breakfast',2],['Lunch',12],['Lunch',6],['Snacks',9],['Breakfast',1]].forEach(([m,i])=>{const f=FOODS[i];st.food.push({ts:h(m=='Breakfast'?8:m=='Lunch'?12:15),meal:m,n:f[0],kcal:f[1],p:f[2],c:f[3],f:f[4]})});
 [8,9,10,12,14].forEach(x=>st.water.push({ts:h(x),ml:250}));
}
function load(){try{st=JSON.parse(localStorage.getItem(KEY))}catch(e){}if(!st||!st.goals)seed(),save()}
function save(){localStorage.setItem(KEY,JSON.stringify(st))}
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('show'),1800)}
// ---------- stats
function today(){const T=x=>x.filter(e=>isToday(e.ts));const g=st.goals;
 const sess=T(st.strength);let sets=sess.reduce((a,b)=>a+b.sets,0),vol=sess.reduce((a,b)=>a+b.vol,0);
 if(st.live.s){st.live.s.ex.forEach(e=>e.sets.forEach(s=>{if(s.d){sets++;vol+=s.w*s.r}}))}
 const cmin=T(st.cardio).reduce((a,b)=>a+b.dur,0)/60+(st.live.c?st.live.c.el/60:0);
 const md=T(st.mood).sort((a,b)=>b.ts-a.ts)[0];const sl=st.sleep.find(s=>s.date===dk(Date.now()));
 const fd=T(st.food),kcal=fd.reduce((a,b)=>a+b.kcal,0),P=fd.reduce((a,b)=>a+b.p,0),C=fd.reduce((a,b)=>a+b.c,0),F=fd.reduce((a,b)=>a+b.f,0);
 const ml=T(st.water).reduce((a,b)=>a+b.ml,0);
 return{sets,vol,cmin,md,sl,kcal,P,C,F,ml,
  segs:[{id:'strength',n:'Strength',p:sets/g.sets,v:`${sets}/${g.sets}`,s:`sets · ${fmtN(vol)} ${st.unit}`},
  {id:'cardio',n:'Cardio',p:cmin/g.cardio,v:`${Math.round(cmin)} min`,s:`of ${g.cardio} zone min`},
  {id:'mood',n:'Mood',p:md?md.mood/5:0,v:md?MOODS[md.mood-1]:'—',s:md?'Logged '+tstr(md.ts):'Not logged yet'},
  {id:'sleep',n:'Sleep',p:sl?sl.min/(g.sleep*60):0,v:sl?hm(sl.min):'—',s:`Goal ${g.sleep}h`},
  {id:'nutrition',n:'Nutrition',p:kcal/g.kcal,v:fmtN(kcal),s:`of ${fmtN(g.kcal)} kcal`},
  {id:'hydration',n:'Hydration',p:ml/g.water,v:`${(ml/250).toFixed(ml%250?1:0)} / ${g.water/250}`,s:`cups · ${fmtN(ml)} ml`}]}}
function days7(){const a=[];for(let i=6;i>=0;i--){const t=Date.now()-i*DAY;a.push({t,k:dk(t),l:'SMTWTFS'[new Date(t).getDay()]})}return a}
function dayMin(k){return[...st.strength,...st.cardio].filter(e=>dk(e.ts)===k).reduce((a,b)=>a+b.dur,0)/60}
function streak(){let n=0;for(let i=0;i<365;i++){const k=dk(Date.now()-i*DAY);const any=[...st.strength,...st.cardio,...st.mood].some(e=>dk(e.ts)===k);if(any)n++;else if(i>0)break}return n}
function recovery(T){const sl=T.sl?Math.min(1,T.sl.min/(st.goals.sleep*60)):.6,md=T.md?T.md.mood/5:.6,ss=T.md?1-T.md.stress/100:.6;return Math.round(100*(sl*.5+md*.25+ss*.25))}
// ---------- wheel
const ICON={strength:'<path d="M6 8v8M18 8v8M3 10v4M21 10v4M6 12h12"/>',cardio:'<path d="M3 12h4l2-5 4 10 2-5h6"/>',mood:'<circle cx="12" cy="12" r="9"/><path d="M8 14s1.5 2 4 2 4-2 4-2M9 9h.01M15 9h.01"/>',sleep:'<path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/>',nutrition:'<path d="M12 7c-3-2-7 0-7 5s3 9 5 9c1 0 1.5-.5 2-.5s1 .5 2 .5c2 0 5-4 5-9s-4-7-7-5zM12 7c0-2 1-4 3-4"/>',hydration:'<path d="M12 3s6 6.5 6 11a6 6 0 0 1-12 0c0-4.5 6-11 6-11z"/>'};
const C=177,R=128,W=24,GAP=17,NS='http://www.w3.org/2000/svg';
const pt=(a,r)=>[C+r*Math.cos((a-90)*Math.PI/180),C+r*Math.sin((a-90)*Math.PI/180)];
const arc=(a0,a1,r)=>{if(a1-a0<.01)a1=a0+.01;const[x0,y0]=pt(a0,r),[x1,y1]=pt(a1,r);return`M${x0} ${y0} A${r} ${r} 0 ${a1-a0>180?1:0} 1 ${x1} ${y1}`};
$('#defs').innerHTML='<filter id="gl" filterUnits="userSpaceOnUse" x="-40" y="-40" width="434" height="434"><feGaussianBlur stdDeviation="7"/></filter><pattern id="hatch" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="5" height="5" fill="#000"/><rect width="2.2" height="5" fill="#fff"/></pattern><pattern id="pdots" width="5" height="5" patternUnits="userSpaceOnUse"><rect width="5" height="5" fill="#000"/><circle cx="2.5" cy="2.5" r="1.4" fill="#fff"/></pattern><pattern id="lines" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="4" fill="#000"/><rect width="4" height="1.6" fill="#fff"/></pattern>';
const PAT=['#fff','url(#hatch)','rgba(255,255,255,.55)','url(#pdots)','rgba(255,255,255,.3)','url(#lines)'];
let TD,cur=-1,drag=false,moved=false;
function renderWheel(){const segs=$('#segs');let h='';
 for(let i=0;i<72;i++){const[a,b]=pt(i*5,R-24),[c,d]=pt(i*5,R-(i%6?20:16));h+=`<line x1="${a}" y1="${b}" x2="${c}" y2="${d}" stroke="#3f3f46"/>`}
 h+=`<circle cx="${C}" cy="${C}" r="${R-34}" fill="rgba(24,24,27,.5)" stroke="#1f1f23"/>`;
 TD.segs.forEach((s,i)=>{const a0=i*60+GAP/2,a1=(i+1)*60-GAP/2,ap=a0+(a1-a0)*Math.min(1,s.p),[ix,iy]=pt(i*60+30,R+36);
  h+=`<g class="seg s${i}${i===cur?' on':''}" data-i="${i}" data-seg="${s.id}"><path class="glow" d="${arc(a0,ap,R)}" stroke="#fff" stroke-width="${W+8}" fill="none" filter="url(#gl)" opacity="0"/>
  <path d="${arc(a0,a1,R)}" stroke="#fff" stroke-opacity=".1" stroke-width="${W}" fill="none"/>
  ${s.p>0?`<path class="prog" d="${arc(a0,ap,R)}" stroke="${PAT[i]}" stroke-width="${W}" fill="none"/>`:''}
  <path d="${arc(a0,a1,R)}" stroke="transparent" stroke-width="${W+30}" fill="none"/>
  <g transform="translate(${ix-13} ${iy-13})"><circle cx="13" cy="13" r="13" fill="#000" stroke="#fff" stroke-opacity=".5"/><g transform="translate(6 6) scale(.58)" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">${ICON[s.id]}</g></g></g>`});
 segs.innerHTML=h;readout()}
function readout(){const rk=$('#rk'),rv=$('#rv'),rs=$('#rs');
 if(cur<0){const sc=Math.round(TD.segs.reduce((a,s)=>a+Math.min(1,s.p),0)/6*100);rk.textContent=drag?'Release to cancel':'Today';rv.textContent=sc;rs.textContent='Overall score'}
 else{const s=TD.segs[cur];rk.textContent=s.n;rv.textContent=s.v;rs.textContent=s.s}}
function hi(i){if(i===cur)return;cur=i;document.querySelectorAll('#segs .seg').forEach((g,j)=>{g.classList.toggle('on',j===i);g.querySelector('.glow').setAttribute('opacity',j===i?.6:0)});$('#wheel').classList.toggle('active',i>=0);readout();
 if(i>=0){$('#plus').animate([{scale:1},{scale:1.12},{scale:1}],{duration:180});navigator.vibrate&&navigator.vibrate(8)}}
const plus=$('#plus');let sx,sy;
plus.addEventListener('pointerdown',e=>{drag=true;moved=false;sx=e.clientX;sy=e.clientY;plus.setPointerCapture(e.pointerId);plus.classList.add('drag');readout()});
plus.addEventListener('pointermove',e=>{if(!drag)return;let dx=e.clientX-sx,dy=e.clientY-sy,d=Math.hypot(dx,dy);if(d>4)moved=true;const m=R-6;if(d>m){dx*=m/d;dy*=m/d}
 plus.style.transform=`translate(${dx}px,${dy}px) scale(${d>48?.82:1})`;if(d<48)hi(-1);else hi(Math.floor(((Math.atan2(dy,dx)*180/Math.PI+90+360)%360)/60))});
function endDrag(){if(!drag)return;drag=false;plus.classList.remove('drag');plus.style.transform='';const i=cur;hi(-1);if(i>=0)openTool(TD.segs[i].id)}
plus.addEventListener('pointerup',endDrag);plus.addEventListener('pointercancel',endDrag);
$('#segs').addEventListener('click',e=>{const g=e.target.closest('.seg');if(g&&!drag)openTool(g.dataset.seg)});
// ---------- bento
function renderBento(){const T=TD,g=st.goals,D=days7();const mins=D.map(d=>dayMin(d.k)),mx=Math.max(30,...mins),tot=mins.reduce((a,b)=>a+b,0);
 const sl=D.map(d=>(st.sleep.find(s=>s.date===d.k)||{}).min||0),sv=sl.filter(Boolean),sMin=Math.min(...sv,360)-20,sMax=Math.max(...sv,500)+10;
 const sp=sl.map((m,i)=>[i*250/6,m?60-(m-sMin)/(sMax-sMin)*52:60]);const sline=sp.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
 const rec=recovery(T),steps=4200+Math.round(T.cmin*110);
 const mshade=['#404040','#5c5c5c','#8a8a8a','#bdbdbd','#fff'];
 const mood=D.map(d=>{const m=st.mood.filter(x=>dk(x.ts)===d.k).sort((a,b)=>b.ts-a.ts)[0];return{l:d.l,m:m?m.mood:0,today:d.k===dk(Date.now())}});
 const cups=Math.floor(T.ml/250),gc=g.water/250;const lastHr=(st.cardio.slice().sort((a,b)=>b.ts-a.ts)[0]||{hr:140}).hr;
 const pc=(v,goal)=>Math.min(100,v/goal*100);
 $('#bento').innerHTML=`
 <div class="t c4" data-go="activity" data-test="tile-activity"><div class="row"><div><div class="tl"><i style="background:#fff"></i>Weekly activity</div><div class="big">${hm(tot)}<small>active</small></div></div><span class="mono" style="color:#fff">${fmtN(T.vol)} ${st.unit} today</span></div>
  <div class="bars">${D.map((d,i)=>`<div><b class="${i==6?'h':''}" style="height:${Math.max(4,mins[i]/mx*62)}px"></b><span>${d.l}</span></div>`).join('')}</div></div>
 <div class="t c2" data-go="insights"><div class="tl"><i style="background:#fff"></i>Recovery</div>
  <svg width="100%" height="92" viewBox="0 0 140 92" style="margin-top:6px"><path d="M22 82 A50 50 0 0 1 118 82" fill="none" stroke="#262626" stroke-width="10"/><path d="M22 82 A50 50 0 0 1 118 82" fill="none" stroke="#fff" stroke-width="10" pathLength="100" stroke-dasharray="${rec} 100"/><text x="70" y="70" text-anchor="middle" fill="#fff" font-size="26" font-weight="500">${rec}</text><text x="70" y="87" text-anchor="middle" fill="#737373" font-size="10">${rec>75?'Primed to train':rec>55?'Moderate load':'Take it easy'}</text></svg></div>
 <div class="t c2" data-go="insights"><div class="tl"><i style="background:#fff"></i>Heart rate</div><div class="big">58<small>bpm rest</small></div>
  <svg width="100%" height="44" viewBox="0 0 140 44" preserveAspectRatio="none" style="margin-top:6px"><path d="M0 26 L38 26 L44 10 L50 40 L56 4 L62 30 L68 26 L100 26 L106 18 L112 32 L118 26 L140 26" fill="none" stroke="#fff" stroke-width="1.5"/></svg><div style="font-size:11px;color:#737373">Last session avg ${lastHr}</div></div>
 <div class="t c3" data-tool="sleep" data-test="tile-sleep"><div class="row"><div><div class="tl"><i style="background:#fff"></i>Sleep trend</div><div class="big">${T.sl?hm(T.sl.min):'—'}<small>last night</small></div></div><span class="mono" style="color:#fff">avg ${hm(sv.reduce((a,b)=>a+b,0)/Math.max(1,sv.length))}</span></div>
  <svg width="100%" height="64" viewBox="0 0 250 64" preserveAspectRatio="none" style="margin-top:8px"><path d="${sline} L250 64 L0 64Z" fill="rgba(255,255,255,.12)"/><path d="${sline}" fill="none" stroke="#fff" stroke-width="1.5"/></svg></div>
 <div class="t c1" data-go="insights" style="display:flex;flex-direction:column;align-items:center;justify-content:center;padding:10px 6px"><svg width="58" height="58" viewBox="0 0 58 58"><circle cx="29" cy="29" r="24" fill="none" stroke="#262626" stroke-width="6"/><circle cx="29" cy="29" r="24" fill="none" stroke="#fff" stroke-width="6" pathLength="100" stroke-dasharray="${pc(steps,10000)} 100" transform="rotate(-90 29 29)"/><text x="29" y="33" text-anchor="middle" fill="#fff" font-size="12" font-weight="500">${Math.round(pc(steps,10000))}%</text></svg><div style="font-size:13px;font-weight:500;margin-top:6px">${fmtN(steps)}</div><div style="font-size:10px;color:#737373">steps</div></div>
 <div class="t c2" data-tool="nutrition" data-test="tile-macros"><div class="tl"><i style="background:#fff"></i>Macros</div><div class="big" data-test="kcal">${fmtN(T.kcal)}<small>/ ${fmtN(g.kcal)}</small></div>
  <div class="leg">${[['Protein',T.P,g.p],['Carbs',T.C,g.c],['Fat',T.F,g.f]].map(([n,v,gg])=>`<div style="display:block"><div style="display:flex;justify-content:space-between"><span>${n}</span><span>${Math.round(v)}g</span></div><div class="mbar"><i style="width:${pc(v,gg)}%"></i></div></div>`).join('')}</div></div>
 <div class="t c2" data-tool="hydration" data-test="tile-water"><div class="tl"><i style="background:#fff"></i>Hydration</div><div class="big" data-test="cups">${cups}<small>/ ${gc} cups</small></div>
  <div class="cups">${Array.from({length:gc},(_,i)=>`<b class="${i<cups?'f':''}"></b>`).join('')}</div><div style="font-size:11px;color:#737373;margin-top:10px">${fmtN(T.ml)} ml · ${T.ml>=g.water?'Goal hit':fmtN(g.water-T.ml)+' ml to go'}</div></div>
 <div class="t c4" data-tool="mood" data-test="tile-mood"><div class="row"><div class="tl"><i style="background:#fff"></i>Mood this week</div><span style="font-size:11px;color:#a3a3a3">${T.md?'Today: '+MOODS[T.md.mood-1]:'Tap to check in'}</span></div>
  <div class="dots">${mood.map(m=>`<div><b style="background:${m.m?mshade[m.m-1]:'transparent'};${m.today?'box-shadow:0 0 0 2px #000,0 0 0 3.5px #fff;':''}${m.m?'':'border:1px dashed #404040;'}"></b>${m.l}</div>`).join('')}</div></div>`}
// ---------- pages
const ORDER=['home','insights','activity','profile'];let page='home',hfilter='All';
function go(p){if(p===page){if(p!=='home')renderPage(p);return}const oi=ORDER.indexOf(page),ni=ORDER.indexOf(p);const o=$('#p-'+page),n=$('#p-'+p);
 renderPage(p);n.classList.toggle('left',ni<oi);n.style.transition='none';n.offsetWidth;n.style.transition='';o.classList.remove('on');o.classList.toggle('left',ni>oi);n.classList.remove('left');n.classList.add('on');n.scrollTop=0;page=p;
 document.querySelectorAll('#tabbar a').forEach(a=>a.classList.toggle('a',a.dataset.go===p))}
function renderPage(p){if(p==='activity')renderActivity();if(p==='insights')renderInsights();if(p==='profile')renderProfile();if(p==='home')renderHome()}
function histList(){const L=[];
 st.strength.forEach(s=>L.push({k:'Strength',ts:s.ts,t:`${s.ex.slice(0,2).join(', ')}${s.ex.length>2?' +'+(s.ex.length-2):''}`,d:`${s.sets} set${s.sets==1?"":"s"} · ${fmtN(s.vol)} ${st.unit} · ${clk(s.dur)}`}));
 st.cardio.forEach(s=>L.push({k:'Cardio',ts:s.ts,t:{run:'Run',bike:'Ride',row:'Row'}[s.type],d:`${(s.dist/1000).toFixed(2)} km · ${clk(s.dur)} · ${s.hr} bpm`}));
 st.mood.forEach(s=>L.push({k:'Mood',ts:s.ts,t:MOODS[s.mood-1],d:`Energy ${s.energy} · Stress ${s.stress}${s.tags.length?' · '+s.tags.join(', '):''}`}));
 st.sleep.forEach(s=>{const[y,m,d]=s.date.split('-').map(Number);L.push({k:'Sleep',ts:+new Date(y,m-1,d,7),t:hm(s.min),d:`${s.bed} → ${s.wake} · Quality ${s.q}/5`})});
 const byDay={};st.food.forEach(f=>{(byDay[dk(f.ts)]=byDay[dk(f.ts)]||{ts:f.ts,k:0,n:0}).k+=f.kcal;byDay[dk(f.ts)].n++});Object.values(byDay).forEach(v=>L.push({k:'Nutrition',ts:v.ts,t:fmtN(v.k)+' kcal',d:`${v.n} item${v.n>1?'s':''} logged`}));
 const wd={};st.water.forEach(w=>{(wd[dk(w.ts)]=wd[dk(w.ts)]||{ts:w.ts,ml:0}).ml+=w.ml});Object.values(wd).forEach(v=>L.push({k:'Hydration',ts:v.ts,t:fmtN(v.ml)+' ml',d:`${(v.ml/250).toFixed(1)} cups`}));
 return L.sort((a,b)=>b.ts-a.ts)}
const KI={Strength:0,Cardio:1,Mood:2,Sleep:3,Nutrition:4,Hydration:5};
const sw=i=>`<svg width="30" height="30" viewBox="0 0 30 30" style="flex:none"><rect x=".5" y=".5" width="29" height="29" fill="${PAT[i]}" stroke="#333"/></svg>`;
function renderActivity(){const L=histList().filter(e=>hfilter==='All'||e.k===hfilter);let last='',h='';

  h+=`<div class="lrow">${sw(KI[e.k])}<div class="g"><b>${esc(e.t)}</b><span>${esc(e.d)}</span></div><span class="mono">${e.k}</span></div>`});

A.tag=t=>{const i=view.tags.indexOf(t);i<0?view.tags.push(t):view.tags.splice(i,1);renderTool()};
A.mSave=()=>{st.mood.push({ts:Date.now(),mood:view.mood,energy:view.energy,stress:view.stress,tags:view.tags.slice(),note:view.note.trim()});save();view.mood=0;view.tags=[];view.note='';renderTool();renderHome();toast('Check-in saved')};
// sleep
const sdur=(b,w)=>{const[bh,bm]=b.split(':').map(Number),[wh,wm]=w.split(':').map(Number);let m=wh*60+wm-(bh*60+bm);if(m<=0)m+=1440;return m};
function tSleep(){const D=days7(),m=sdur(view.bed,view.wake),g=st.goals.sleep;
 const ns=D.map(d=>(st.sleep.find(s=>s.date===d.k)||{}).min||0);
 return`<div class="mono">Last night · duration</div><div class="huge" id="sl-d" style="margin:8px 0 4px">${hm(m)}</div><div class="mono" id="sl-p" style="margin-bottom:16px">${Math.round(m/(g*60)*100)}% of ${g}h goal</div>
 <div class="row2"><label><div class="mono" style="margin-bottom:6px">Bedtime</div><input class="inp" type="time" value="${view.bed}" data-test="bed" oninput="view.bed=this.value||view.bed;A.sl()"></label><label><div class="mono" style="margin-bottom:6px">Wake</div><input class="inp" type="time" value="${view.wake}" data-test="wake" oninput="view.wake=this.value||view.wake;A.sl()"></label></div>
 <div class="lbl mono">Quality</div><div class="moods">${[1,2,3,4,5].map(q=>`<div class="${view.sq===q?'on':''}" onclick="view.sq=${q};renderTool()"><span style="font-size:20px;font-weight:500;display:block;color:inherit">${q}</span>${['Poor','Fair','OK','Good','Great'][q-1]}</div>`).join('')}</div>
 <button class="btn fill" style="width:100%;margin-top:16px" data-test="sleep-save" onclick="A.slSave()">Save night</button>
 <div class="lbl mono">Last 7 nights</div>
 <svg width="100%" height="140" viewBox="0 0 354 140">${D.map((d,i)=>{const h=ns[i]/600*110;return`<rect x="${i*50+8}" y="${118-h}" width="34" height="${h}" fill="${i==6?'#fff':'url(#hatch)'}" stroke="#fff" stroke-width=".5"/><text x="${i*50+25}" y="${112-h}" text-anchor="middle" fill="#a3a3a3" font-size="9" font-family="monospace">${ns[i]?(ns[i]/60).toFixed(1):''}</text><text x="${i*50+25}" y="134" text-anchor="middle" fill="#737373" font-size="10" font-family="monospace">${d.l}</text>`}).join('')}<line x1="0" x2="354" y1="${118-g*60/600*110}" y2="${118-g*60/600*110}" stroke="#fff" stroke-dasharray="3 3" opacity=".5"/></svg>`}
A.sl=()=>{const m=sdur(view.bed,view.wake);$('#sl-d').textContent=hm(m);$('#sl-p').textContent=Math.round(m/(st.goals.sleep*60)*100)+'% of '+st.goals.sleep+'h goal'};
A.slSave=()=>{const k=dk(Date.now());st.sleep=st.sleep.filter(s=>s.date!==k);st.sleep.push({date:k,bed:view.bed,wake:view.wake,q:view.sq,min:sdur(view.bed,view.wake)});save();renderTool();renderHome();toast('Night saved')};
// nutrition
function tNutrition(){const T=today(),g=st.goals;const items=st.food.filter(f=>isToday(f.ts));const q=view.q.toLowerCase();
 const res=q?FOODS.filter(f=>f[0].toLowerCase().includes(q)).slice(0,6):[];
 return`<div class="row" style="align-items:flex-end"><div><div class="mono">Eaten</div><div class="huge" id="n-k">${fmtN(T.kcal)}</div></div><div style="text-align:right"><div class="mono">Remaining</div><div style="font-size:26px;font-weight:500;letter-spacing:-.04em">${fmtN(Math.max(0,g.kcal-T.kcal))}</div><div class="mono">of ${fmtN(g.kcal)} kcal</div></div></div>
 <div class="mbar" style="height:8px;margin-top:12px"><i style="width:${Math.min(100,T.kcal/g.kcal*100)}%"></i></div>
 <div class="row3" style="margin-top:12px">${[['Protein',T.P,g.p],['Carbs',T.C,g.c],['Fat',T.F,g.f]].map(([n,v,gg])=>`<div><div class="mono">${n}</div><div style="font-size:15px;font-weight:500;margin-top:2px">${Math.round(v)}<span style="color:#737373"> / ${gg}g</span></div><div class="mbar"><i style="width:${Math.min(100,v/gg*100)}%"></i></div></div>`).join('')}</div>
 <div class="lbl mono">Add to</div><div class="chips">${['Breakfast','Lunch','Dinner','Snacks'].map(m=>`<span class="chipx${view.meal===m?' on':''}" onclick="view.meal='${m}';renderTool()">${m}</span>`).join('')}</div>
 <input class="inp" id="n-q" style="margin-top:10px" placeholder="Search foods (e.g. chicken)" value="${esc(view.q)}" data-test="food-search" oninput="view.q=this.value;A.nRes()">
 <div id="n-res">${res.map(f=>foodRow(f)).join('')}</div>
 <details style="margin-top:12px"><summary class="mono" style="cursor:pointer;color:#fff">+ Quick add custom</summary>
  <input class="inp" id="n-cn" placeholder="Name" style="margin-top:8px"><div class="row2" style="grid-template-columns:repeat(4,1fr);margin-top:6px"><input class="inp" id="n-ck" type="number" placeholder="kcal"><input class="inp" id="n-cp" type="number" placeholder="P g"><input class="inp" id="n-cc" type="number" placeholder="C g"><input class="inp" id="n-cf" type="number" placeholder="F g"></div><button class="btn sm" style="margin-top:6px" onclick="A.nCustom()">Add item</button></details>
 ${['Breakfast','Lunch','Dinner','Snacks'].map(m=>{const L=items.filter(f=>f.meal===m);return`<div class="lbl mono" style="display:flex;justify-content:space-between;border-bottom:1px solid #262626;padding-bottom:6px"><span>${m}</span><span style="color:#fff">${fmtN(L.reduce((a,b)=>a+b.kcal,0))} kcal</span></div>${L.map(f=>`<div class="lrow"><div class="g"><b>${esc(f.n)}</b><span>${f.kcal} kcal · P${f.p} C${f.c} F${f.f}</span></div><span class="x" onclick="A.nDel(${st.food.indexOf(f)})">×</span></div>`).join('')||'<p style="color:#525252;font-size:12px;padding:8px 0">Nothing yet</p>'}`}).join('')}`}
const foodRow=f=>`<div class="lrow"><div class="g"><b>${f[0]}</b><span>${f[1]} kcal · P${f[2]} C${f[3]} F${f[4]}</span></div><span class="x" data-test="food-add" onclick="A.nAdd(${FOODS.indexOf(f)})">+</span></div>`;
A.nRes=()=>{const q=view.q.toLowerCase();$('#n-res').innerHTML=q?(FOODS.filter(f=>f[0].toLowerCase().includes(q)).slice(0,6).map(foodRow).join('')||'<p style="color:#737373;font-size:12px;padding:8px 0">No match — use quick add.</p>'):''};
A.nAdd=i=>{const f=FOODS[i];st.food.push({ts:Date.now(),meal:view.meal,n:f[0],kcal:f[1],p:f[2],c:f[3],f:f[4]});save();view.q='';renderTool();renderHome();toast(`Added to ${view.meal}`)};
A.nCustom=()=>{const n=$('#n-cn').value.trim(),k=+$('#n-ck').value;if(!n||!k){toast('Name and kcal required');return}st.food.push({ts:Date.now(),meal:view.meal,n,kcal:k,p:+$('#n-cp').value||0,c:+$('#n-cc').value||0,f:+$('#n-cf').value||0});save();renderTool();renderHome();toast('Added')};
A.nDel=i=>{st.food.splice(i,1);save();renderTool();renderHome()};
// hydration
function tHydration(){const T=today(),g=st.goals.water,p=Math.min(1,T.ml/g),L=st.water.filter(w=>isToday(w.ts)).sort((a,b)=>b.ts-a.ts);
 return`<div class="vessel"><svg width="120" height="190" viewBox="0 0 120 190"><defs><clipPath id="vc"><path d="M14 8h92l-10 172H24z"/></clipPath></defs><g clip-path="url(#vc)"><rect class="wfill" x="0" y="${186-178*p}" width="120" height="${178*p+4}" fill="url(#lines)"/><rect class="wfill" x="0" y="${186-178*p}" width="120" height="2" fill="#fff"/></g><path d="M14 8h92l-10 172H24z" fill="none" stroke="#fff" stroke-width="1.5"/>${[.25,.5,.75].map(f=>`<line x1="98" x2="106" y1="${186-178*f}" y2="${186-178*f}" stroke="#fff" opacity=".5"/>`).join('')}</svg>
 <div><div class="mono">Today</div><div class="huge" data-test="ml">${fmtN(T.ml)}</div><div class="mono">ml of ${fmtN(g)} · ${Math.round(p*100)}%</div><div style="margin-top:10px;font-size:13px;color:#a3a3a3">${(T.ml/250).toFixed(1)} / ${g/250} cups</div></div></div>
 <div class="row3" style="margin-top:18px"><button class="btn fill" data-test="cup" onclick="A.w(250)">+ Cup<br>250</button><button class="btn" onclick="A.w(500)">+ Bottle<br>500</button><button class="btn ghost" onclick="A.wUndo()" ${L.length?'':'disabled'}>Undo<br>last</button></div>
 <div style="display:flex;gap:6px;margin-top:8px"><input class="inp" id="w-c" type="number" placeholder="Custom ml"><button class="btn sm" onclick="A.w(+$('#w-c').value)">Add</button></div>
 <div class="lbl mono">Log</div>${L.map(w=>`<div class="lrow"><span class="mono" style="color:#fff;min-width:64px">${tstr(w.ts)}</span><div class="g"><b>${w.ml} ml</b></div><span class="x" onclick="A.wDel(${st.water.indexOf(w)})">×</span></div>`).join('')||'<p style="color:#737373;font-size:13px">No water logged.</p>'}`}
A.w=ml=>{if(!(ml>0&&ml<3000)){toast('Enter 1–3000 ml');return}st.water.push({ts:Date.now(),ml:Math.round(ml)});save();renderTool();renderHome();toast(`+${ml} ml`)};
A.wUndo=()=>{const L=st.water.filter(w=>isToday(w.ts)).sort((a,b)=>b.ts-a.ts);if(L[0]){st.water.splice(st.water.indexOf(L[0]),1);save();renderTool();renderHome();toast('Undone')}};
A.wDel=i=>{st.water.splice(i,1);save();renderTool();renderHome()};
// ticker
setInterval(()=>{cTick();if(tool==='strength'&&st.live.s&&!view.summary){const s=st.live.s;const e=$('#s-el');if(e)e.textContent=clk((Date.now()-s.start)/1000);const r=$('#s-rest');if(r){const left=s.restEnd?(s.restEnd-Date.now())/1000:0;if(left>0){r.style.display='flex';$('#s-rt').textContent=clk(left)}else{if(s.restEnd){s.restEnd=null;save();navigator.vibrate&&navigator.vibrate(200);toast('Rest over — next set')}r.style.display='none'}}}
 if(tool==='cardio'&&st.live.c){const c=st.live.c;const s=(i,v)=>{const e=$(i);if(e)e.textContent=v};s('#c-el',clk(c.el));s('#c-d',(c.dist/1000).toFixed(2));s('#c-p',pace(c));s('#c-hr',Math.round(c.hr));const l=$('#c-hrl');if(l)l.setAttribute('d',hrPath(c))}
 if(!tool&&page==='home'&&(st.live.c&&st.live.c.run)){TD=today();readout()}},1000);
load();renderHome();
</script></body></html>
